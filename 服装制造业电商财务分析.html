<!DOCTYPE html>
<html lang="zh-CN"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服装电商制造业智能财务分析平台 v2.0</title>
<!-- Plotly.js (CDN) -->
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
<!-- SheetJS for Excel parsing -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ============================ 全局样式 ============================ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
  background: #F4F6F7; color: #2C3E50; font-size: 14px;
}
:root {
  --primary: #1F3A5F; --primary-light: #3E5F8A; --accent: #E8743B;
  --accent-light: #F2A07A; --success: #2E8B57; --danger: #C0392B;
  --warning: #D4AC0D; --neutral: #7F8C8D; --bg-light: #F4F6F7;
  --bg-card: #FFFFFF; --text-dark: #2C3E50; --text-light: #566573;
}
/* 布局 */
.app-container { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; background: linear-gradient(180deg, #1F3A5F 0%, #2C3E50 100%);
  color: #fff; padding: 18px 14px; position: fixed; height: 100vh;
  overflow-y: auto; box-shadow: 2px 0 10px rgba(0,0,0,0.15); z-index: 100;
}
.main-content { margin-left: 260px; flex: 1; padding: 20px 24px; min-width: 0; }
/* 侧边栏 */
.sidebar-header {
  background: rgba(255,255,255,0.1); padding: 14px; border-radius: 8px;
  text-align: center; margin-bottom: 16px; font-size: 15px; font-weight: 700;
}
.sidebar-section { margin-bottom: 18px; }
.sidebar-section h4 {
  font-size: 12px; color: #F2A07A; text-transform: uppercase;
  letter-spacing: 1px; margin-bottom: 10px; padding-bottom: 6px;
  border-bottom: 1px solid rgba(255,255,255,0.15);
}
.nav-item {
  display: block; padding: 9px 12px; margin-bottom: 4px; border-radius: 6px;
  color: #ECF0F1; cursor: pointer; font-size: 13px; transition: all 0.2s;
  border-left: 3px solid transparent;
}
.nav-item:hover { background: rgba(255,255,255,0.08); }
.nav-item.active {
  background: rgba(232,116,59,0.2); border-left-color: #E8743B; color: #fff; font-weight: 600;
}
.sidebar select, .sidebar input[type="date"], .sidebar input[type="file"] {
  width: 100%; padding: 7px 9px; border-radius: 5px; border: 1px solid #3E5F8A;
  background: #fff; color: #2C3E50; font-size: 12px; margin-bottom: 8px;
}
.sidebar label { font-size: 11px; color: #BDC3C7; display: block; margin-bottom: 4px; }
.checkbox-group label {
  display: inline-block; margin-right: 8px; font-size: 12px; color: #ECF0F1; cursor: pointer;
}
.sidebar-footer {
  margin-top: 20px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.15);
  font-size: 10px; color: #95A5A6; text-align: center;
}
/* 主标题 */
.main-title {
  background: linear-gradient(135deg, #1F3A5F 0%, #3E5F8A 100%); color: #fff;
  padding: 16px 24px; border-radius: 10px; font-size: 22px; font-weight: 700;
  box-shadow: 0 4px 12px rgba(31,58,95,0.25); margin-bottom: 6px;
}
.sub-title { color: #566573; font-size: 12px; margin-bottom: 16px; padding-left: 4px; }
.data-source-banner {
  padding: 8px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 12px;
}
.banner-info { background: #D6EAF8; color: #1A5276; border-left: 4px solid #2E86C1; }
.banner-success { background: #D5F5E3; color: #1E8449; border-left: 4px solid #2E8B57; }
/* 模块标题 */
.module-header {
  background: linear-gradient(90deg, #1F3A5F 0%, #3E5F8A 100%); color: #fff;
  padding: 11px 20px; border-radius: 8px; font-size: 17px; font-weight: 600; margin-bottom: 16px;
}
.section-header {
  color: #1F3A5F; font-size: 15px; font-weight: 600;
  border-bottom: 2px solid #E8743B; padding-bottom: 6px; margin: 18px 0 12px 0;
}
/* KPI 卡片 */
.kpi-grid { display: grid; gap: 12px; margin-bottom: 16px; }
.kpi-grid.cols-6 { grid-template-columns: repeat(6, 1fr); }
.kpi-grid.cols-5 { grid-template-columns: repeat(5, 1fr); }
.kpi-grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
.kpi-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.kpi-card {
  background: #fff; border-radius: 10px; padding: 14px 16px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-left: 4px solid #1F3A5F;
}
.kpi-card.accent { border-left-color: #E8743B; }
.kpi-card.success { border-left-color: #2E8B57; }
.kpi-card.danger { border-left-color: #C0392B; }
.kpi-card.warning { border-left-color: #D4AC0D; }
.kpi-label { font-size: 12px; color: #566573; margin-bottom: 4px; }
.kpi-value { font-size: 22px; font-weight: 700; color: #1F3A5F; }
.kpi-delta { font-size: 11px; margin-top: 4px; color: #7F8C8D; }
.kpi-delta.up { color: #2E8B57; }
.kpi-delta.down { color: #C0392B; }
/* 图表容器 */
.chart-row { display: grid; gap: 16px; margin-bottom: 16px; }
.chart-row.cols-3-2 { grid-template-columns: 3fr 2fr; }
.chart-row.cols-2 { grid-template-columns: 1fr 1fr; }
.chart-row.cols-3 { grid-template-columns: 1fr 1fr 1fr; }
.chart-box {
  background: #fff; border-radius: 10px; padding: 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}
.chart-box .chart-title {
  font-size: 14px; font-weight: 600; color: #1F3A5F; margin-bottom: 8px;
}
.plot-chart { width: 100%; }
/* 标签页 */
.tabs {
  display: flex; gap: 4px; border-bottom: 2px solid #ECF0F1; margin-bottom: 16px; flex-wrap: wrap;
}
.tab {
  padding: 9px 18px; cursor: pointer; font-size: 13px; font-weight: 500;
  background: #F4F6F7; border-radius: 6px 6px 0 0; border: none; color: #566573;
  transition: all 0.2s;
}
.tab:hover { background: #EAEDED; }
.tab.active { background: #1F3A5F; color: #fff; }
.tab-content { display: none; }
.tab-content.active { display: block; }
/* AI 分析结论 */
.ai-insight-box {
  background: linear-gradient(135deg, #F4F6F7 0%, #EAEDED 100%);
  border-left: 4px solid #E8743B; border-radius: 8px; padding: 14px 18px; margin-top: 16px;
}
.ai-insight-title { color: #1F3A5F; font-size: 14px; font-weight: 700; margin-bottom: 8px; }
.ai-insight-item { color: #2C3E50; font-size: 12.5px; line-height: 1.7; padding: 3px 0; }
.tag {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  font-size: 10px; font-weight: 600; margin-right: 6px;
}
.tag-warn { background: #FDEBD0; color: #B9770E; }
.tag-good { background: #D5F5E3; color: #1E8449; }
.tag-bad { background: #FADBD8; color: #922B21; }
.tag-info { background: #D6EAF8; color: #1A5276; }
/* 预警框 */
.alert-box { border-radius: 8px; padding: 11px 15px; margin-bottom: 9px; font-size: 12.5px; }
.alert-danger { background: #FADBD8; border-left: 4px solid #C0392B; }
.alert-warning { background: #FCF3CF; border-left: 4px solid #D4AC0D; }
.alert-info { background: #D6EAF8; border-left: 4px solid #2E86C1; }
.alert-success { background: #D5F5E3; border-left: 4px solid #2E8B57; }
/* 表格 */
.data-table {
  width: 100%; border-collapse: collapse; font-size: 12px;
  background: #fff; border-radius: 8px; overflow: hidden; margin-bottom: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.07);
}
.data-table th {
  background: #1F3A5F; color: #fff; padding: 9px 10px; text-align: center; font-weight: 600;
}
.data-table td { padding: 7px 10px; text-align: center; border-bottom: 1px solid #ECF0F1; }
.data-table tr:nth-child(even) td { background: #F8F9FA; }
.data-table tr:hover td { background: #EBF5FB; }
.table-wrap { overflow-x: auto; margin-bottom: 12px; }
/* 加载中 */
.loading {
  text-align: center; padding: 40px; color: #7F8C8D; font-size: 14px;
}
/* 按钮 */
.btn {
  display: inline-block; padding: 7px 16px; background: #1F3A5F; color: #fff;
  border: none; border-radius: 6px; cursor: pointer; font-size: 12px; transition: all 0.2s;
}
.btn:hover { background: #3E5F8A; }
.btn-accent { background: #E8743B; }
.btn-accent:hover { background: #F2A07A; }
/* 响应式 */
@media (max-width: 1200px) {
  .kpi-grid.cols-6 { grid-template-columns: repeat(3, 1fr); }
  .kpi-grid.cols-5 { grid-template-columns: repeat(3, 1fr); }
  .chart-row.cols-3-2, .chart-row.cols-2, .chart-row.cols-3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app-container">
  <!-- ============ 侧边栏 ============ -->
  <div class="sidebar">
    <div class="sidebar-header">👔 智能财务分析平台 v2.0</div>
    <div class="sidebar-section">
      <h4>📂 数据上传</h4>
      <input type="file" id="fileInput" accept=".xlsx,.xls">
      <button class="btn btn-accent" style="width:100%;" onclick="loadMockData()">使用模拟数据</button>
    </div>
    <div class="sidebar-section">
      <h4>🧭 模块导航</h4>
      <div id="navList"></div>
    </div>
    <div class="sidebar-section">
      <h4>📅 日期筛选</h4>
      <label>开始日期</label>
      <input type="date" id="startDate" value="2024-01-01">
      <label>结束日期</label>
      <input type="date" id="endDate" value="2025-12-31">
      <button class="btn" style="width:100%;margin-top:6px;" onclick="applyFilters()">应用筛选</button>
    </div>
    <div class="sidebar-section">
      <h4>🏪 平台筛选</h4>
      <div class="checkbox-group" id="platformFilter"></div>
    </div>
    <div class="sidebar-footer">© 2025 服装电商制造业<br>智能财务分析平台</div>
  </div>

  <!-- ============ 主内容 ============ -->
  <div class="main-content">
    <div class="main-title">👔 服装电商制造业智能财务分析平台 v2.0</div>
    <div class="sub-title" id="subTitle">覆盖"生产-仓储-销售-回款"全链路财务监控</div>
    <div id="dataSourceBanner"></div>
    <div id="moduleContent"><div class="loading">正在加载数据...</div></div>
  </div>
</div>

<script>
/* ============================================================
   全局配置
============================================================ */
const PLATFORMS = ["天猫","淘宝","抖音","拼多多","小红书","京东"];
const PLATFORM_WEIGHTS = [0.25,0.20,0.20,0.15,0.10,0.10];
const EXPENSE_TYPES = ["推广费","物流费","人工费","管理费","其他"];
const DEPARTMENTS = ["生产部","运营部","客服部","仓储部","管理部","设计部"];
const ROLE_DEPT = {
  "生产部":["裁剪工","缝纫工","质检员","生产主管","包装工"],
  "运营部":["店长","运营专员","推广专员","活动策划","数据分析员"],
  "客服部":["售前客服","售后客服","客服主管"],
  "仓储部":["仓管员","拣货员","打包员","仓储主管"],
  "管理部":["总经理","财务主管","行政专员","HR专员"],
  "设计部":["设计师","版师","设计主管"]
};
const SKU_POOL = [
  "WS-T001-白-M","WS-T001-白-L","WS-T001-黑-M","WS-T001-黑-L",
  "WS-D002-红-S","WS-D002-红-M","WS-D002-蓝-M","WS-D002-蓝-L",
  "WS-S003-灰-M","WS-S003-灰-L","WS-S003-黑-L","WS-S003-黑-XL",
  "MS-T101-白-L","MS-T101-黑-L","MS-T101-灰-XL","MS-T101-蓝-L",
  "MS-J102-黑-M","MS-J102-黑-L","MS-J102-灰-L","MS-J102-灰-XL",
  "KS-SK101-粉-S","KS-SK101-粉-M","KS-SK101-黑-M","KS-SK101-黑-L",
  "KS-C102-米-S","KS-C102-米-M","KS-C102-卡其-M","KS-C102-卡其-L",
  "AC-H001-黑","AC-H001-白","AC-S002-灰","AC-S002-黑"
];
const BENCH = {
  grossMargin:0.45, netMargin:0.08, invTurnoverDays:60,
  vatBurden:0.025, incomeTaxBurden:0.015, compositeTax:0.04,
  promoRateMax:0.25, laborCostRate:0.12,
  prodPerCapita:1000000, opsPerCapitaGMV:5000000, returnRate:0.20
};
const COLORS = ["#1F3A5F","#E8743B","#2E8B57","#C0392B","#D4AC0D","#3E5F8A","#F2A07A","#7F8C8D","#8E44AD","#16A085"];
const PLOT_LAYOUT = {
  font:{family:"Microsoft YaHei",size:12,color:"#2C3E50"},
  plot_bgcolor:"#FFFFFF", paper_bgcolor:"#FFFFFF",
  margin:{l:55,r:30,t:50,b:45},
  legend:{orientation:"h",yanchor:"bottom",y:1.02,xanchor:"right",x:1,bgcolor:"rgba(255,255,255,0.8)"},
  hoverlabel:{bgcolor:"#1F3A5F",font:{size:12,family:"Microsoft YaHei",color:"white"}}
};
const PLOT_CONFIG = {responsive:true, displaylogo:false, toImageButtonOptions:{format:"png",filename:"chart"}};

/* 全局状态 */
let DATA = null;        // 原始数据
let MONTHLY = null;     // 月度汇总
let FILTERED = null;    // 筛选后数据
let currentModule = "ceo";
let dateFilter = ["2024-01-01","2025-12-31"];
let platformFilter = ["全部"];

/* ============================================================
   工具函数
============================================================ */
function fmtMoney(v){
  v = Number(v)||0;
  if(Math.abs(v)>=1e8) return (v/1e8).toFixed(2)+"亿";
  if(Math.abs(v)>=1e4) return (v/1e4).toFixed(2)+"万";
  return v.toLocaleString("zh-CN",{maximumFractionDigits:0});
}
function fmtMoneyFull(v){ return (Number(v)||0).toLocaleString("zh-CN",{maximumFractionDigits:2}); }
function fmtPct(v,d=2){ return ((Number(v)||0)*100).toFixed(d)+"%"; }
function fmtDelta(curr,prev){
  if(!prev) return ["新增","up"];
  let d=(curr-prev)/prev;
  return [(d>=0?"↑ ":"↓ ")+Math.abs(d*100).toFixed(1)+"%", d>=0?"up":"down"];
}
function rand(min,max){ return Math.random()*(max-min)+min; }
function randInt(min,max){ return Math.floor(rand(min,max+1)); }
function choice(arr,w){
  if(!w) return arr[Math.floor(Math.random()*arr.length)];
  let r=Math.random(), s=0;
  for(let i=0;i<arr.length;i++){ s+=w[i]; if(r<s) return arr[i]; }
  return arr[arr.length-1];
}
function round(v,d=2){ let p=Math.pow(10,d); return Math.round(v*p)/p; }
function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0),0); }
function mean(arr){ return arr.length?sum(arr)/arr.length:0; }
function std(arr){
  if(arr.length<2) return 0;
  let m=mean(arr);
  return Math.sqrt(mean(arr.map(x=>(x-m)*(x-m))));
}
function groupBy(arr,keyFn){
  let g={};
  arr.forEach(o=>{ let k=keyFn(o); (g[k]=g[k]||[]).push(o); });
  return g;
}
function ym(d){ return d.substring(0,7); }
function insightHtml(title,items){
  let tagClass={warn:"tag-warn",good:"tag-good",bad:"tag-bad",info:"tag-info"};
  let tagText={warn:"预警",good:"利好",bad:"风险",info:"洞察"};
  let h=items.map(it=>{
    let t=Array.isArray(it)?it[0]:"info", txt=Array.isArray(it)?it[1]:it;
    return `<div class="ai-insight-item"><span class="tag ${tagClass[t]||"tag-info"}">${tagText[t]||"洞察"}</span>${txt}</div>`;
  }).join("");
  return `<div class="ai-insight-box"><div class="ai-insight-title">🤖 AI 智能分析结论 — ${title}</div>${h}</div>`;
}
function alertHtml(level,msg){ return `<div class="alert-box alert-${level}">${msg}</div>`; }
function tableHtml(rows,cols){
  if(!rows.length) return "<div style='color:#7F8C8D;padding:10px;'>暂无数据</div>";
  let h="<table class='data-table'><thead><tr>"+cols.map(c=>`<th>${c.label}</th>`).join("")+"</tr></thead><tbody>";
  rows.forEach(r=>{ h+="<tr>"+cols.map(c=>`<td>${r[c.key]!==undefined?r[c.key]:"-"}</td>`).join("")+"</tr>"; });
  return h+"</tbody></table>";
}
function plot(divId,traces,layout,height=380){
  let el=document.getElementById(divId);
  if(!el) return;
  let l=Object.assign({},PLOT_LAYOUT,layout||{},{height:height});
  Plotly.newPlot(divId,traces,l,PLOT_CONFIG);
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

/* ============================================================
   模拟数据生成：24个月（2年）
   特征：Q4季节性高峰、年增长15%、退货率18-25%、推广费率18-28%
============================================================ */
function generateMockData(){
  let orders=[], production=[], inventory=[], expense=[], personnel=[], tax=[], logistics=[];
  let orderSeq=100000;
  let skuInfo={};
  SKU_POOL.forEach(sku=>{ skuInfo[sku]=choice([79,99,129,159,199,259,299,399]); });

  let start=new Date("2024-01-01"), end=new Date("2025-12-31");
  let monthlySeason={1:0.70,2:0.60,3:0.95,4:0.85,5:0.90,6:1.10,7:0.95,8:0.90,9:1.05,10:1.15,11:1.60,12:1.45};
  let yearFactor=d=>d.getFullYear()===2025?1.15:1.0;
  let discountMap={"天猫":0.85,"淘宝":0.80,"抖音":0.78,"拼多多":0.70,"小红书":0.88,"京东":0.83};
  let returnMap={"天猫":0.18,"淘宝":0.22,"抖音":0.25,"拼多多":0.20,"小红书":0.19,"京东":0.15};

  // 订单表
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){
    let season=monthlySeason[d.getMonth()+1], yf=yearFactor(d);
    let n=Math.floor(randInt(15,40)*season*yf);
    for(let i=0;i<n;i++){
      orderSeq++;
      let sku=choice(SKU_POOL), platform=choice(PLATFORMS,PLATFORM_WEIGHTS);
      let basePrice=skuInfo[sku];
      let qty=choice([1,1,1,2,2,3,4,5],[0.3,0.15,0.15,0.12,0.10,0.08,0.06,0.04]);
      let discount=discountMap[platform]+rand(-0.05,0.05);
      let original=basePrice*qty, paid=round(original*discount,2);
      let isReturn=Math.random()<returnMap[platform]?1:0;
      let freight=round(rand(8,18),2);
      let promo=round(paid*rand(0.18,0.28),2);
      let dateStr=d.toISOString().substring(0,10);
      orders.push({订单号:"ORD"+orderSeq,日期:dateStr,平台:platform,SKU:sku,数量:qty,
        原价:round(original,2),实付金额:paid,退货标记:isReturn?"是":"否",运费:freight,推广费分摊:promo});
    }
  }

  // 生产表（按月）
  for(let y=2024;y<=2025;y++){
    for(let m=1;m<=12;m++){
      let d=new Date(y,m-1,1);
      let season=monthlySeason[m], yf=yearFactor(d);
      SKU_POOL.forEach(sku=>{
        let basePrice=skuInfo[sku];
        let qty=Math.floor(randInt(50,200)*season*yf);
        if(qty<10) return;
        let fabric=round(basePrice*rand(0.15,0.22),2)*qty;
        let aux=round(basePrice*rand(0.03,0.06),2)*qty;
        let process=round(basePrice*rand(0.10,0.15),2)*qty;
        let qc=round(basePrice*rand(0.01,0.03),2)*qty;
        let pack=round(basePrice*rand(0.02,0.04),2)*qty;
        production.push({日期:d.toISOString().substring(0,10),SKU:sku,面料成本:fabric,辅料成本:aux,
          加工费:process,质检费:qc,包装费:pack,生产数量:qty});
      });
    }
  }
  production.forEach(p=>{
    p.生产总成本=p.面料成本+p.辅料成本+p.加工费+p.质检费+p.包装费;
    p.单件生产成本=round(p.生产总成本/p.生产数量,2);
  });

  // 库存表
  SKU_POOL.forEach(sku=>{
    let basePrice=skuInfo[sku];
    let init=randInt(100,500);
    let prodQty=sum(production.filter(p=>p.SKU===sku).map(p=>p.生产数量));
    let orderQty=sum(orders.filter(o=>o.SKU===sku&&o.退货标记==="否").map(o=>o.数量));
    let inQty=Math.floor(prodQty*0.85), outQty=Math.floor(orderQty);
    let endStock=Math.max(0,init+inQty-outQty);
    let unitCost=mean(production.filter(p=>p.SKU===sku).map(p=>p.单件生产成本))||basePrice*0.4;
    inventory.push({SKU:sku,期初库存:init,入库量:inQty,出库量:outQty,期末库存:endStock,
      库存金额:round(endStock*unitCost,2),库龄天数:randInt(15,180)});
  });

  // 费用表
  for(let y=2024;y<=2025;y++){
    for(let m=1;m<=12;m++){
      let dStr=`${y}-${String(m).padStart(2,"0")}-01`;
      let monthOrders=orders.filter(o=>o.日期.substring(0,7)===`${y}-${String(m).padStart(2,"0")}`);
      let promo=sum(monthOrders.map(o=>o.推广费分摊));
      let logistics_=sum(monthOrders.map(o=>o.运费))*1.3;
      let season=monthlySeason[m], yf=y===2025?1.15:1.0;
      let labor=350000*season*yf+rand(-20000,20000);
      let mgmt=80000*yf+rand(-5000,15000);
      let other=40000*yf+rand(-5000,10000);
      expense.push({日期:dStr,费用类型:"推广费",金额:round(promo,2),部门:"运营部",备注:"全渠道推广投放"});
      expense.push({日期:dStr,费用类型:"物流费",金额:round(logistics_,2),部门:"仓储部",备注:"快递及仓储物流"});
      expense.push({日期:dStr,费用类型:"人工费",金额:round(labor,2),部门:"管理部",备注:"全员薪酬社保"});
      expense.push({日期:dStr,费用类型:"管理费",金额:round(mgmt,2),部门:"管理部",备注:"办公及行政管理"});
      expense.push({日期:dStr,费用类型:"其他",金额:round(other,2),部门:"管理部",备注:"杂项支出"});
    }
  }

  // 人员表
  let namePool=["张伟","王芳","李娜","刘洋","陈静","杨帆","赵磊","黄丽","周强","吴敏","徐勇","孙琳","马超","朱彤","胡军","郭鹏","林燕","何涛","高洁","罗刚"];
  let pid=1;
  Object.keys(ROLE_DEPT).forEach(dept=>{
    ROLE_DEPT[dept].forEach(role=>{
      let n=randInt(3,9);
      for(let i=0;i<n;i++){
        let name=namePool[pid%namePool.length]+String(pid).padStart(2,"0");
        let hireDays=randInt(0,700);
        let hireDate=new Date(2024,0,1); hireDate.setDate(hireDate.getDate()+hireDays);
        let baseSal=6000;
        [["主管",12000],["店长",10000],["设计师",11000],["版师",9000],["经理",15000],["专员",7000]].forEach(([k,v])=>{ if(role.includes(k)) baseSal=v; });
        personnel.push({姓名:name,部门:dept,岗位:role,入职日期:hireDate.toISOString().substring(0,10),
          月薪:round(baseSal+rand(-1000,2000),2),出勤天数:randInt(18,26)});
        pid++;
      }
    });
  });

  // 税负表
  for(let y=2024;y<=2025;y++){
    for(let m=1;m<=12;m++){
      let dStr=`${y}-${String(m).padStart(2,"0")}-01`;
      let monthOrders=orders.filter(o=>o.日期.substring(0,7)===`${y}-${String(m).padStart(2,"0")}`);
      let sales=sum(monthOrders.map(o=>o.实付金额));
      let monthProd=production.filter(p=>p.日期.substring(0,7)===`${y}-${String(m).padStart(2,"0")}`);
      let prodCost=sum(monthProd.map(p=>p.生产总成本));
      let vatOutput=round(sales/1.13*0.13,2);
      let vatInput=round(prodCost*0.7/1.13*0.13,2);
      let vatPayable=Math.max(0,vatOutput-vatInput);
      let surcharge=round(vatPayable*0.12,2);
      let monthProfit=sales*0.08;
      let incomeTax=round(monthProfit*0.10,2);
      let otherTax=round(sales*0.005,2);
      tax.push({日期:dStr,增值税销项:vatOutput,增值税进项:vatInput,企业所得税:incomeTax,
        附加税:surcharge,其他税费:otherTax,应纳增值税:vatPayable,
        税费合计:round(vatPayable+incomeTax+surcharge+otherTax,2)});
    }
  }

  // 物流表
  let regions=["华东","华南","华北","华中","西南","西北","东北"];
  let couriers=["顺丰","中通","圆通","韵达","申通","极兔"];
  let regionFactor={"华东":1.0,"华南":1.1,"华北":1.15,"华中":1.05,"西南":1.25,"西北":1.35,"东北":1.30};
  let courierFactor={"顺丰":1.5,"中通":0.9,"圆通":0.88,"韵达":0.85,"申通":0.92,"极兔":0.80};
  let sampleSize=Math.min(orders.length,8000);
  for(let i=0;i<sampleSize;i++){
    let o=orders[Math.floor(Math.random()*orders.length)];
    let region=choice(regions), courier=choice(couriers,[0.15,0.25,0.20,0.18,0.12,0.10]);
    let weight=round(rand(0.3,2.5),2);
    let baseExpress=8+weight*2;
    let fee=round(baseExpress*regionFactor[region]*courierFactor[courier],2);
    logistics.push({日期:o.日期,订单号:o.订单号,快递费:fee,区域:region,重量:weight,快递公司:courier});
  }

  return {orders,production,inventory,expense,personnel,tax,logistics};
}

/* ============================================================
   数据预处理：派生字段
============================================================ */
function preprocessData(data){
  data.orders.forEach(o=>{
    o.日期=new Date(o.日期); o.年月=o.日期.toISOString().substring(0,7);
    o.年=o.日期.getFullYear(); o.月=o.日期.getMonth()+1;
    o.是否退货=o.退货标记==="是"||/是|Y|1/i.test(String(o.退货标记))?1:0;
    o.净销售额=o.是否退货?0:o.实付金额;
  });
  data.production.forEach(p=>{
    p.日期=new Date(p.日期); p.年月=p.日期.toISOString().substring(0,7);
    p.生产总成本=(p.面料成本||0)+(p.辅料成本||0)+(p.加工费||0)+(p.质检费||0)+(p.包装费||0);
    p.单件生产成本=p.生产数量>0?round(p.生产总成本/p.生产数量,2):0;
  });
  data.expense.forEach(e=>{ e.日期=new Date(e.日期); e.年月=e.日期.toISOString().substring(0,7); });
  data.tax.forEach(t=>{ t.日期=new Date(t.日期); t.年月=t.日期.toISOString().substring(0,7); });
  data.logistics.forEach(l=>{ l.日期=new Date(l.日期); l.年月=l.日期.toISOString().substring(0,7); });
  if(data.personnel) data.personnel.forEach(p=>{ p.入职日期=new Date(p.入职日期); });
  return data;
}

/* ============================================================
   月度汇总
============================================================ */
function getMonthlySummary(data){
  let orders=data.orders;
  let ymGroups=groupBy(orders,o=>o.年月);
  let monthly=[];
  Object.keys(ymGroups).sort().forEach(k=>{
    let rows=ymGroups[k];
    let gmv=sum(rows.map(r=>r.实付金额));
    let netSales=sum(rows.map(r=>r.净销售额));
    let returnAmt=sum(rows.filter(r=>r.是否退货).map(r=>r.实付金额));
    let orderCount=rows.length;
    let returnCount=rows.filter(r=>r.是否退货).length;
    let freight=sum(rows.map(r=>r.运费));
    let promo=sum(rows.map(r=>r.推广费分摊));
    let qty=sum(rows.map(r=>r.数量));
    let prodRows=data.production.filter(p=>p.年月===k);
    let prodCost=sum(prodRows.map(p=>p.生产总成本));
    let prodQty=sum(prodRows.map(p=>p.生产数量));
    let expRows=data.expense.filter(e=>e.年月===k);
    let expByType={}; EXPENSE_TYPES.forEach(t=>expByType[t]=0);
    expRows.forEach(e=>{ expByType[e.费用类型]=(expByType[e.费用类型]||0)+e.金额; });
    let taxRows=data.tax.filter(t=>t.年月===k);
    let taxTotal=sum(taxRows.map(t=>t.税费合计));
    let salesCost=prodCost;
    let grossProfit=netSales-salesCost;
    let totalExpense=sum(Object.values(expByType));
    let operatingProfit=grossProfit-totalExpense;
    let netProfit=operatingProfit-taxTotal;
    monthly.push({年月:k,GMV:gmv,净销售额:netSales,退货金额:returnAmt,订单数:orderCount,退货订单数:returnCount,
      运费合计:freight,推广费合计:promo,销售件数:qty,生产成本:prodCost,生产数量:prodQty,
      退货率:orderCount?returnCount/orderCount:0,推广费率:gmv?promo/gmv:0,
      销售成本:salesCost,毛利:grossProfit,毛利率:netSales?grossProfit/netSales:0,
      总费用:totalExpense,营业利润:operatingProfit,净利润:netProfit,
      净利率:netSales?netProfit/netSales:0,经营现金流:netProfit*0.85,税费合计:taxTotal,
      推广费:expByType["推广费"]||0,物流费:expByType["物流费"]||0,
      人工费:expByType["人工费"]||0,管理费:expByType["管理费"]||0,其他:expByType["其他"]||0});
  });
  // 环比
  for(let i=0;i<monthly.length;i++){
    if(i===0){ monthly[i].净销售额环比=0; monthly[i].净利润环比=0; }
    else{
      monthly[i].净销售额环比=monthly[i-1].净销售额? (monthly[i].净销售额-monthly[i-1].净销售额)/monthly[i-1].净销售额:0;
      monthly[i].净利润环比=monthly[i-1].净利润? (monthly[i].净利润-monthly[i-1].净利润)/monthly[i-1].净利润:0;
    }
  }
  return monthly;
}

/* ============================================================
   筛选数据
============================================================ */
function filterData(){
  let s=new Date(dateFilter[0]), e=new Date(dateFilter[1]);
  let pf=platformFilter.includes("全部")?null:platformFilter;
  let f={};
  f.orders=DATA.orders.filter(o=>o.日期>=s&&o.日期<=e&&(!pf||pf.includes(o.平台)));
  f.production=DATA.production.filter(p=>p.日期>=s&&p.日期<=e);
  f.inventory=DATA.inventory;
  f.expense=DATA.expense.filter(x=>x.日期>=s&&x.日期<=e);
  f.personnel=DATA.personnel;
  let sStr=dateFilter[0].substring(0,7), eStr=dateFilter[1].substring(0,7);
  f.tax=DATA.tax.filter(t=>t.年月>=sStr&&t.年月<=eStr);
  f.logistics=DATA.logistics.filter(l=>l.日期>=s&&l.日期<=e);
  return f;
}

function renderProfit(){
  let c=FILTERED, m=MONTHLY.filter(r=>r.年月>=dateFilter[0].substring(0,7)&&r.年月<=dateFilter[1].substring(0,7));
  let html='<div class="module-header">💰 模块2：盈利深度分析</div>';

    <button class="tab" onclick="switchTab(this,'profit-channel')">分渠道利润表</button>
    <button class="tab" onclick="switchTab(this,'profit-breakeven')">盈亏平衡</button>
    <button class="tab" onclick="switchTab(this,'profit-sensitivity')">敏感性分析</button></div>`;
  html+='<div id="profit-dupont" class="tab-content active"></div><div id="profit-channel" class="tab-content"></div><div id="profit-breakeven" class="tab-content"></div><div id="profit-sensitivity" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  // 杜邦分析
  if(m.length){
    let netSales=sum(m.map(r=>r.净销售额)), netProfit=sum(m.map(r=>r.净利润));
    let stockValue=sum(c.inventory.map(r=>r.库存金额));
    let totalAssets=netSales/1.5+stockValue*0.5, equity=totalAssets*0.60;
    let equityMultiplier=totalAssets/equity, assetTurnover=netSales/totalAssets;
    let netMargin=netSales?netProfit/netSales:0, roe=netMargin*assetTurnover*equityMultiplier;
    document.getElementById("profit-dupont").innerHTML=`
      <div class="section-header">杜邦分析：ROE = 净利率 × 总资产周转率 × 权益乘数</div>
      <div class="kpi-grid cols-4">
        <div class="kpi-card"><div class="kpi-label">净利率</div><div class="kpi-value">${fmtPct(netMargin)}</div><div class="kpi-delta">净利润 ${fmtMoney(netProfit)}</div></div>
        <div class="kpi-card accent"><div class="kpi-label">总资产周转率</div><div class="kpi-value">${assetTurnover.toFixed(2)}</div><div class="kpi-delta">总资产 ${fmtMoney(totalAssets)}</div></div>
        <div class="kpi-card accent"><div class="kpi-label">权益乘数</div><div class="kpi-value">${equityMultiplier.toFixed(2)}</div><div class="kpi-delta">权益 ${fmtMoney(equity)}</div></div>
        <div class="kpi-card ${roe>=0.15?'success':'danger'}"><div class="kpi-label">ROE 净资产收益率</div><div class="kpi-value">${fmtPct(roe)}</div><div class="kpi-delta">基准 15%</div></div>
      </div>
      <div class="chart-box"><div class="chart-title">杜邦分析拆解</div><div id="dupontChart" class="plot-chart"></div></div>
      ${insightHtml("杜邦分析结论",[["info",`当前 ROE ${fmtPct(roe)}，${roe>=0.15?"优于":"低于"}15%基准。`],["info",`净利率 ${fmtPct(netMargin)} 是ROE核心驱动。`],assetTurnover<1.5?["warn",`总资产周转率 ${assetTurnover.toFixed(2)} 低于基准，建议加快周转。`]:["good","资产周转效率良好。"]])}`;
    plot("dupontChart",[{x:["净销售额","净利率","总资产周转率","权益乘数","ROE"],y:[netSales,netMargin,assetTurnover,equityMultiplier,roe],
      type:"waterfall",measure:["absolute","relative","relative","relative","total"],
      increasing:{marker:{color:COLORS[2]}},decreasing:{marker:{color:COLORS[3]}},totals:{marker:{color:COLORS[0]}}}],{height:380});
  } else document.getElementById("profit-dupont").innerHTML="<div class='loading'>暂无数据</div>";

  // 分渠道利润表
  if(c.orders.length){
    let skuCost={};
    c.production.forEach(p=>{ skuCost[p.SKU]=(skuCost[p.SKU]||0)+p.生产总成本; });
    let skuQty={}; c.production.forEach(p=>{ skuQty[p.SKU]=(skuQty[p.SKU]||0)+p.生产数量; });
    let rows=[];
    let validOrders=c.orders.filter(o=>!o.是否退货);
    let platGroups=groupBy(validOrders,o=>o.平台);
    Object.keys(platGroups).forEach(p=>{
      let po=platGroups[p];
      let revenue=sum(po.map(o=>o.实付金额)), qty=sum(po.map(o=>o.数量));
      let cogs=sum(po.map(o=>(skuCost[o.SKU]||o.实付金额*0.45)/Math.max(1,skuQty[o.SKU])*o.数量));
      let promo=sum(po.map(o=>o.推广费分摊)), freight=sum(po.map(o=>o.运费))*1.3;
      let gp=revenue-cogs, op=gp-promo-freight, np=op*0.9;
      rows.push({平台:p,净销售额:fmtMoneyFull(revenue),销售成本:fmtMoneyFull(cogs),毛利:fmtMoneyFull(gp),
        毛利率:revenue?fmtPct(gp/revenue):"-",推广费:fmtMoneyFull(promo),物流费:fmtMoneyFull(freight),
        营业利润:fmtMoneyFull(op),净利润:fmtMoneyFull(np),净利率:revenue?fmtPct(np/revenue):"-"});
    });
    rows.sort((a,b)=>parseFloat(b.净销售额.replace(/,/g,""))-parseFloat(a.净销售额.replace(/,/g,"")));
    document.getElementById("profit-channel").innerHTML=`
      <div class="section-header">分渠道利润表</div>
      <div class="table-wrap">${tableHtml(rows,[{key:"平台"},{key:"净销售额"},{key:"销售成本"},{key:"毛利"},{key:"毛利率"},{key:"推广费"},{key:"物流费"},{key:"营业利润"},{key:"净利润"},{key:"净利率"}])}</div>
      <div class="chart-box"><div id="channelChart" class="plot-chart"></div></div>
      ${insightHtml("分渠道利润分析",[["good",`利润最高渠道：${rows[0].平台}，净利润 ${rows[0].净利润}。`],["warn",`利润最弱渠道：${rows[rows.length-1].平台}，建议优化。`]])}`;
    plot("channelChart",[
      {x:rows.map(r=>r.平台),y:rows.map(r=>parseFloat(r.净利润.replace(/,/g,""))),name:"净利润",type:"bar",marker:{color:COLORS}},
      {x:rows.map(r=>r.平台),y:rows.map(r=>parseFloat(r.毛利率)),name:"毛利率",type:"bar",yaxis:"y2",marker:{color:COLORS[1]}}
    ],{yaxis:{title:"净利润"},yaxis2:{title:"毛利率",overlaying:"y",side:"right",tickformat:".0%"},barmode:"group",height:350});
  } else document.getElementById("profit-channel").innerHTML="<div class='loading'>暂无订单数据</div>";

  // 盈亏平衡
  if(m.length){
    let fixedCost=sum(m.map(r=>r.人工费))+sum(m.map(r=>r.管理费))+sum(m.map(r=>r.其他));
    let variableCost=sum(m.map(r=>r.销售成本))+sum(m.map(r=>r.推广费));
    let revenue=sum(m.map(r=>r.净销售额)), qty=sum(m.map(r=>r.销售件数));
    let unitPrice=qty?revenue/qty:0, unitVar=qty?variableCost/qty:0, unitCon=unitPrice-unitVar;
    let beQty=unitCon>0?fixedCost/unitCon:0, beRev=beQty*unitPrice, safety=revenue?(revenue-beRev)/revenue:0;
    document.getElementById("profit-breakeven").innerHTML=`
      <div class="section-header">盈亏平衡分析</div>
      <div class="kpi-grid cols-4">
        <div class="kpi-card"><div class="kpi-label">固定成本</div><div class="kpi-value">${fmtMoney(fixedCost)}</div><div class="kpi-delta">人工+管理+其他</div></div>
        <div class="kpi-card accent"><div class="kpi-label">单位贡献毛利</div><div class="kpi-value">${fmtMoney(unitCon)}</div><div class="kpi-delta">售价${fmtMoney(unitPrice)}-变动${fmtMoney(unitVar)}</div></div>
        <div class="kpi-card accent"><div class="kpi-label">盈亏平衡销量</div><div class="kpi-value">${Math.round(beQty).toLocaleString()}件</div><div class="kpi-delta">收入${fmtMoney(beRev)}</div></div>
        <div class="kpi-card ${safety>=0.2?'success':'danger'}"><div class="kpi-label">安全边际率</div><div class="kpi-value">${fmtPct(safety)}</div><div class="kpi-delta">≥20%安全</div></div>
      </div>
      <div class="chart-box"><div class="chart-title">盈亏平衡分析图</div><div id="beChart" class="plot-chart"></div></div>
      ${insightHtml("盈亏平衡分析",[["info",`盈亏平衡点 ${Math.round(beQty).toLocaleString()} 件，收入 ${fmtMoney(beRev)}。`],["info",`安全边际率 ${fmtPct(safety)}，${safety>=0.2?"经营安全":"风险偏高"}。`]])}`;
    let qRange=Array.from({length:100},(_,i)=>i*qty*1.3/99);
    plot("beChart",[
      {x:qRange,y:qRange.map(q=>q*unitPrice),name:"收入线",type:"scatter",mode:"lines",line:{color:COLORS[0],width:2.5}},
      {x:qRange,y:qRange.map(q=>fixedCost+q*unitVar),name:"总成本线",type:"scatter",mode:"lines",line:{color:COLORS[1],width:2.5}},
      {x:[beQty],y:[beRev],name:"盈亏平衡点",type:"scatter",mode:"markers",marker:{size:14,color:COLORS[3],symbol:"star"}},
      {x:[qty],y:[revenue],name:"当前销量",type:"scatter",mode:"markers",marker:{size:12,color:COLORS[2]}}
    ],{xaxis:{title:"销量(件)"},yaxis:{title:"金额(元)"},height:400});
  } else document.getElementById("profit-breakeven").innerHTML="<div class='loading'>暂无数据</div>";

  // 敏感性分析
  if(m.length){
    let baseProfit=sum(m.map(r=>r.净利润)), baseRev=sum(m.map(r=>r.净销售额)), baseCost=sum(m.map(r=>r.销售成本));
    let scenarios=[];
    [-0.10,-0.05,0,0.05,0.10].forEach(d=>{ let np=baseProfit+baseRev*d*0.7; scenarios.push({变量:"单价",变化:(d*100).toFixed(0)+"%",净利润:Math.round(np),变化率:baseProfit?((np-baseProfit)/baseProfit*100).toFixed(1)+"%":"-"}); });
    [-0.10,-0.05,0,0.05,0.10].forEach(d=>{ let np=baseProfit-baseCost*d; scenarios.push({变量:"成本",变化:(d*100).toFixed(0)+"%",净利润:Math.round(np),变化率:baseProfit?((np-baseProfit)/baseProfit*100).toFixed(1)+"%":"-"}); });
    [-0.05,-0.025,0,0.025,0.05].forEach(d=>{ let np=baseProfit-baseRev*d*0.5; scenarios.push({变量:"退货率",变化:(d*100).toFixed(1)+"%",净利润:Math.round(np),变化率:baseProfit?((np-baseProfit)/baseProfit*100).toFixed(1)+"%":"-"}); });
    document.getElementById("profit-sensitivity").innerHTML=`
      <div class="section-header">敏感性分析：单价±10%、成本±10%、退货率±5%</div>
      <div class="table-wrap">${tableHtml(scenarios,[{key:"变量"},{key:"变化"},{key:"净利润"},{key:"变化率"}])}</div>
      <div class="chart-box"><div class="chart-title">敏感性龙卷风图</div><div id="sensChart" class="plot-chart"></div></div>
      ${insightHtml("敏感性分析结论",[["info",`基准净利润 ${fmtMoney(baseProfit)}，单价变动影响最大。`],["warn","退货率每升5%，利润侵蚀明显，建议降低退货率。"]])}`;
    let impacts=["单价","成本","退货率"].map(v=>{
      let sub=scenarios.filter(s=>s.变量===v).map(s=>s.净利润);
      return Math.max(Math.abs(Math.max(...sub)-baseProfit),Math.abs(Math.min(...sub)-baseProfit));
    });
    plot("sensChart",[{x:impacts,y:["单价","成本","退货率"],type:"bar",orientation:"h",
      marker:{color:[COLORS[0],COLORS[1],COLORS[4]]}}],{xaxis:{title:"利润波动幅度(元)"},height:300,showlegend:false});
  } else document.getElementById("profit-sensitivity").innerHTML="<div class='loading'>暂无数据</div>";
}

/* ============================================================
   模块3：成本全链路拆解
============================================================ */
function renderCost(){
  let c=FILTERED;
  let html='<div class="module-header">🔧 模块3：成本全链路拆解</div>';
  html+=`<div class="tabs"><button class="tab active" onclick="switchTab(this,'cost-sankey')">桑基图</button>
    <button class="tab" onclick="switchTab(this,'cost-trend')">成本占比趋势</button>
    <button class="tab" onclick="switchTab(this,'cost-unit')">单位成本</button>
    <button class="tab" onclick="switchTab(this,'cost-anomaly')">异常检测</button></div>`;
  html+='<div id="cost-sankey" class="tab-content active"></div><div id="cost-trend" class="tab-content"></div><div id="cost-unit" class="tab-content"></div><div id="cost-anomaly" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  // 桑基图
  if(c.production.length&&c.expense.length){
    let p=c.production;
    let fabric=sum(p.map(r=>r.面料成本)), aux=sum(p.map(r=>r.辅料成本)), proc=sum(p.map(r=>r.加工费));
    let qc=sum(p.map(r=>r.质检费)), pack=sum(p.map(r=>r.包装费)), prodTotal=fabric+aux+proc+qc+pack;
    let promo=sum(c.expense.filter(e=>e.费用类型==="推广费").map(e=>e.金额));
    let logistics_=sum(c.expense.filter(e=>e.费用类型==="物流费").map(e=>e.金额));
    let labor=sum(c.expense.filter(e=>e.费用类型==="人工费").map(e=>e.金额));
    let mgmt=sum(c.expense.filter(e=>e.费用类型==="管理费").map(e=>e.金额));
    let labels=["原材料","面料","辅料","生产","加工费","质检费","包装费","仓储物流","物流费","销售推广","推广费","人工管理","人工费","管理费","总成本"];
    let src=[0,0,0,1,2,3,3,3,3,0,7,8,0,9,10,0,11,12,6,8,10,12,13];
    let tgt=[1,2,3,4,4,4,5,6,14,7,8,9,10,11,12,14,14,14,14,14,14,14,14];
    let val=[fabric,aux,proc,fabric,aux,proc,qc,pack,prodTotal,logistics_,logistics_,promo,promo,labor,mgmt,pack,logistics_,promo,labor,mgmt,pack+pack,pack+pack];
    document.getElementById("cost-sankey").innerHTML=`
      <div class="section-header">成本流转：原材料→生产→仓储→销售→消费者</div>
      <div class="chart-box"><div id="sankeyChart" class="plot-chart"></div></div>
      ${insightHtml("成本流转分析",[["info",`生产环节 ${fmtMoney(prodTotal)} 占比最高，是成本控制核心。`],["info",`物流 ${fmtMoney(logistics_)}，推广 ${fmtMoney(promo)}，需平衡投入产出。`]])}`;
    plot("sankeyChart",[{type:"sankey",node:{label:labels,color:COLORS,pad:15,thickness:18},
      link:{source:src,target:tgt,value:val,color:"rgba(31,58,95,0.3)"}}],{height:450,showlegend:false});
  } else document.getElementById("cost-sankey").innerHTML="<div class='loading'>暂无数据</div>";

  // 成本占比趋势
  if(c.production.length&&c.expense.length){
    let ymGroups={};
    c.production.forEach(p=>{ let k=p.年月; (ymGroups[k]=ymGroups[k]||{面料:0,辅料:0,加工:0,包装:0}); ymGroups[k].面料+=p.面料成本; ymGroups[k].辅料+=p.辅料成本; ymGroups[k].加工+=p.加工费; ymGroups[k].包装+=p.包装费; });
    c.expense.forEach(e=>{ let k=e.年月; (ymGroups[k]=ymGroups[k]||{}); let t={"推广费":"推广","物流费":"物流","人工费":"人工","管理费":"管理"}[e.费用类型]; if(t) ymGroups[k][t]=(ymGroups[k][t]||0)+e.金额; });
    let keys=Object.keys(ymGroups).sort();
    let costItems=["面料","辅料","加工","包装","物流","推广","人工","管理"];
    let totals={}; costItems.forEach(it=>totals[it]=sum(keys.map(k=>ymGroups[k][it]||0)));
    document.getElementById("cost-trend").innerHTML=`
      <div class="section-header">8项成本占比趋势（堆叠面积图）</div>
      <div class="chart-box"><div id="costTrendChart" class="plot-chart"></div></div>
      <div class="chart-box"><div class="chart-title">成本结构占比</div><div id="costPie" class="plot-chart" style="height:350px;"></div></div>
      ${insightHtml("成本结构分析",[["info",`成本占比最高：${Object.entries(totals).sort((a,b)=>b[1]-a[1])[0][0]}（${fmtMoney(Object.entries(totals).sort((a,b)=>b[1]-a[1])[0][1])}）。`]])}`;
    let traces=costItems.map((it,i)=>({x:keys,y:keys.map(k=>ymGroups[k][it]||0),name:it,stackgroup:"one",line:{width:0.5,color:COLORS[i]}}));
    plot("costTrendChart",traces,{yaxis:{title:"成本金额(元)"},height:400});
    plot("costPie",[{labels:costItems,values:costItems.map(it=>totals[it]),type:"pie",hole:0.4,
      marker:{colors:COLORS},textinfo:"label+percent"}],{height:350,showlegend:false});
  } else document.getElementById("cost-trend").innerHTML="<div class='loading'>暂无数据</div>";

  // 单位成本
  if(c.production.length){
    let skuGroups=groupBy(c.production,p=>p.SKU);
    let rows=Object.keys(skuGroups).map(sku=>{
      let rows=skuGroups[sku], qty=sum(rows.map(r=>r.生产数量));
      return {SKU:sku,单件面料:round(sum(rows.map(r=>r.面料成本))/qty,2),单件辅料:round(sum(rows.map(r=>r.辅料成本))/qty,2),
        单件加工:round(sum(rows.map(r=>r.加工费))/qty,2),单件生产成本:round(sum(rows.map(r=>r.生产总成本))/qty,2),生产数量:qty};
    }).sort((a,b)=>b.单件生产成本-a.单件生产成本);
    let totalQty=sum(rows.map(r=>r.生产数量));
    let totalPromo=sum(c.expense.filter(e=>e.费用类型==="推广费").map(e=>e.金额));
    let totalLogistics=sum(c.expense.filter(e=>e.费用类型==="物流费").map(e=>e.金额));
    let unitPromo=totalQty?totalPromo/totalQty:0, unitLog=totalQty?totalLogistics/totalQty:0;
    rows.forEach(r=>{ r.单件推广分摊=round(unitPromo,2); r.单件物流分摊=round(unitLog,2); r.单件完全成本=round(r.单件生产成本+unitPromo+unitLog,2); });
    document.getElementById("cost-unit").innerHTML=`
      <div class="section-header">单位成本分析（分SKU）</div>
      <div class="table-wrap">${tableHtml(rows.slice(0,30),[{key:"SKU"},{key:"单件面料"},{key:"单件辅料"},{key:"单件加工"},{key:"单件生产成本"},{key:"单件推广分摊"},{key:"单件物流分摊"},{key:"单件完全成本"},{key:"生产数量"}])}</div>
      <div class="chart-box"><div class="chart-title">Top15 SKU 单件完全成本拆解</div><div id="unitCostChart" class="plot-chart"></div></div>
      ${insightHtml("单位成本分析",[["info",`单件完全成本最高 ${rows[0].SKU}（${rows[0].单件完全成本}元），最低 ${rows[rows.length-1].SKU}（${rows[rows.length-1].单件完全成本}元）。`]])}`;
    let top=rows.slice(0,15);
    plot("unitCostChart",[
      {x:top.map(r=>r.SKU),y:top.map(r=>r.单件生产成本),name:"生产成本",type:"bar",marker:{color:COLORS[0]}},
      {x:top.map(r=>r.SKU),y:top.map(r=>r.单件推广分摊),name:"推广分摊",type:"bar",marker:{color:COLORS[1]}},
      {x:top.map(r=>r.SKU),y:top.map(r=>r.单件物流分摊),name:"物流分摊",type:"bar",marker:{color:COLORS[4]}}
    ],{barmode:"stack",yaxis:{title:"单件成本(元)"},height:400});
  } else document.getElementById("cost-unit").innerHTML="<div class='loading'>暂无数据</div>";

  // 异常检测
  if(c.production.length){
    let ymGroups={};
    c.production.forEach(p=>{ let k=p.年月; (ymGroups[k]=ymGroups[k]||{面料成本:0,辅料成本:0,加工费:0,质检费:0,包装费:0,生产总成本:0});
      ["面料成本","辅料成本","加工费","质检费","包装费","生产总成本"].forEach(col=>ymGroups[k][col]+=p[col]); });
    let keys=Object.keys(ymGroups).sort();
    let cols=["面料成本","辅料成本","加工费","质检费","包装费","生产总成本"];
    let anomalies=[];
    let prev={};
    keys.forEach((k,i)=>{
      cols.forEach(col=>{
        if(i>0&&prev[col]){ let chg=(ymGroups[k][col]-prev[col])/prev[col]; if(Math.abs(chg)>0.15){ anomalies.push({月份:k,成本项:col,金额:Math.round(ymGroups[k][col]),环比变化:(chg*100).toFixed(1)+"%",方向:chg>0?"上升":"下降"}); } }
        prev[col]=ymGroups[k][col];
      });
    });
    let reasonMap={"面料成本":"面料采购价格波动/单耗增加","加工费":"外协单价上调/加班费增加","辅料成本":"辅料价格波动/包装调整"};
    anomalies.forEach(a=>a.可能原因=reasonMap[a.成本项]||"成本结构变化");
    document.getElementById("cost-anomaly").innerHTML=`
      <div class="section-header">成本异常检测（环比波动>15%标红）</div>
      ${anomalies.length?`<div class="table-wrap">${tableHtml(anomalies,[{key:"月份"},{key:"成本项"},{key:"金额"},{key:"环比变化"},{key:"方向"},{key:"可能原因"}])}</div>`:`<div class="alert-box alert-success">报告期内未检测到成本异常波动（>15%）。</div>`}
      <div class="chart-box"><div class="chart-title">成本环比波动趋势</div><div id="anomalyChart" class="plot-chart"></div></div>
      ${insightHtml("成本异常分析",anomalies.length?[["warn",`检测到 ${anomalies.length} 项成本异常波动。`],["info","建议建立成本预警机制。"]]:[["good","成本波动平稳。"]])}`;
    let traces=cols.map((col,i)=>({x:keys,y:keys.map((k,idx)=>idx>0&&ymGroups[keys[idx-1]][col]?((ymGroups[k][col]-ymGroups[keys[idx-1]][col])/ymGroups[keys[idx-1]][col]):null),name:col,type:"scatter",mode:"lines+markers",line:{color:COLORS[i]}}));
    plot("anomalyChart",traces,{yaxis:{title:"环比变化率",tickformat:".0%"},height:400,
      shapes:[{type:"line",y0:0.15,y1:0.15,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[3]}},{type:"line",y0:-0.15,y1:-0.15,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[3]}}]});
  } else document.getElementById("cost-anomaly").innerHTML="<div class='loading'>暂无数据</div>";
}

/* ============================================================
   模块4：税负智能分析（重点）
============================================================ */
function renderTax(){
  let c=FILTERED;
  let html='<div class="module-header">🏛️ 模块4：税负智能分析（重点）</div>';
  html+=`<div class="tabs"><button class="tab active" onclick="switchTab(this,'tax-dashboard')">税负仪表盘</button>
    <button class="tab" onclick="switchTab(this,'tax-health')">健康评分</button>
    <button class="tab" onclick="switchTab(this,'tax-input')">进项结构</button>
    <button class="tab" onclick="switchTab(this,'tax-warn')">预警模型</button>
    <button class="tab" onclick="switchTab(this,'tax-saving')">节税空间</button></div>`;
  html+='<div id="tax-dashboard" class="tab-content active"></div><div id="tax-health" class="tab-content"></div><div id="tax-input" class="tab-content"></div><div id="tax-warn" class="tab-content"></div><div id="tax-saving" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  let totalOutput=sum(c.tax.map(t=>t.增值税销项)), totalInput=sum(c.tax.map(t=>t.增值税进项));
  let totalVat=sum(c.tax.map(t=>t.应纳增值税)), totalIncomeTax=sum(c.tax.map(t=>t.企业所得税));
  let totalTax=sum(c.tax.map(t=>t.税费合计));
  let taxableRev=totalOutput/0.13;
  let vatBurden=totalOutput?totalVat/(totalOutput/0.13):0;
  let incomeBurden=taxableRev?totalIncomeTax/taxableRev:0;
  let compositeBurden=taxableRev?totalTax/taxableRev:0;

  // 仪表盘
  if(c.tax.length){
    document.getElementById("tax-dashboard").innerHTML=`
      <div class="section-header">税负仪表盘：与行业基准对比</div>
      <div class="kpi-grid cols-5">
        <div class="kpi-card"><div class="kpi-label">增值税税负率</div><div class="kpi-value">${fmtPct(vatBurden)}</div><div class="kpi-delta">基准 ${fmtPct(BENCH.vatBurden)}</div></div>
        <div class="kpi-card accent"><div class="kpi-label">所得税税负率</div><div class="kpi-value">${fmtPct(incomeBurden)}</div><div class="kpi-delta">基准 ${fmtPct(BENCH.incomeTaxBurden)}</div></div>
        <div class="kpi-card accent"><div class="kpi-label">综合税负率</div><div class="kpi-value">${fmtPct(compositeBurden)}</div><div class="kpi-delta">基准 ${fmtPct(BENCH.compositeTax)}</div></div>
        <div class="kpi-card"><div class="kpi-label">应纳增值税</div><div class="kpi-value">${fmtMoney(totalVat)}</div><div class="kpi-delta">销项${fmtMoney(totalOutput)}-进项${fmtMoney(totalInput)}</div></div>
        <div class="kpi-card"><div class="kpi-label">税费合计</div><div class="kpi-value">${fmtMoney(totalTax)}</div><div class="kpi-delta">全部税种</div></div>
      </div>
      <div class="chart-box"><div id="taxTrendChart" class="plot-chart"></div></div>
      ${insightHtml("税负仪表盘分析",[["info",`综合税负率 ${fmtPct(compositeBurden)}，${compositeBurden>BENCH.compositeTax?"高于":"低于"}基准 ${fmtPct(BENCH.compositeTax)}。`],["info",`增值税税负率 ${fmtPct(vatBurden)}，进项抵扣率 ${fmtPct(totalInput/totalOutput)}。`]])}`;
    let ymGroups=groupBy(c.tax,t=>t.年月);
    let keys=Object.keys(ymGroups).sort();
    plot("taxTrendChart",[
      {x:keys,y:keys.map(k=>sum(ymGroups[k].map(t=>t.应纳增值税))),name:"增值税",type:"bar",marker:{color:COLORS[0]}},
      {x:keys,y:keys.map(k=>sum(ymGroups[k].map(t=>t.企业所得税))),name:"所得税",type:"bar",marker:{color:COLORS[1]}},
      {x:keys,y:keys.map(k=>sum(ymGroups[k].map(t=>t.附加税))),name:"附加税",type:"bar",marker:{color:COLORS[4]}},
      {x:keys,y:keys.map(k=>{let o=sum(ymGroups[k].map(t=>t.增值税销项));return o?sum(ymGroups[k].map(t=>t.应纳增值税))/(o/0.13):0;}),name:"增值税税负率",type:"scatter",mode:"lines+markers",yaxis:"y2",line:{color:COLORS[3],width:2.5}}
    ],{yaxis:{title:"税额(元)"},yaxis2:{title:"税负率",overlaying:"y",side:"right",tickformat:".1%"},barmode:"stack",height:400});
  } else document.getElementById("tax-dashboard").innerHTML="<div class='loading'>暂无税负数据</div>";

  // 健康评分
  if(c.tax.length){
    let score1=vatBurden<0.01?15:(vatBurden>0.05?20:40);
    let ratio=totalOutput?totalInput/totalOutput:0;
    let score2=(ratio>=0.7&&ratio<=0.9)?30:((ratio>=0.6&&ratio<=0.95)?20:10);
    let monthlyVatBurden=Object.values(groupBy(c.tax,t=>t.年月)).map(g=>{let o=sum(g.map(t=>t.增值税销项));return o?sum(g.map(t=>t.应纳增值税))/(o/0.13):0;});
    let cv=mean(monthlyVatBurden)?std(monthlyVatBurden)/mean(monthlyVatBurden):1;
    let score3=cv<0.2?30:(cv<0.4?20:10);
    let totalScore=score1+score2+score3;
    let level=totalScore>=80?"健康":(totalScore>=60?"关注":"风险");
    document.getElementById("tax-health").innerHTML=`
      <div class="section-header">税负健康评分（0-100分）</div>
      <div class="chart-row cols-3-2">
        <div class="chart-box"><div id="taxGauge" class="plot-chart"></div></div>
        <div class="chart-box">
          <div class="table-wrap">${tableHtml([{维度:"税负率合理性",得分:score1,满分:40},{维度:"进销匹配度",得分:score2,满分:30},{维度:"税负波动稳定性",得分:score3,满分:30},{维度:"总分",得分:totalScore,满分:100}],[{key:"维度"},{key:"得分"},{key:"满分"}])}</div>
          <div id="taxScoreChart" class="plot-chart" style="height:200px;"></div>
        </div>
      </div>
      ${insightHtml("税负健康评分分析",[["info",`税负健康综合评分 ${totalScore} 分，评级 ${level}。`],score1<30?["warn","税负率偏离合理区间，建议核查进项发票。"]:["good","税负率合理。"],score2<25?["warn","进销匹配度偏低，可能进项积压。"]:["good","进销匹配良好。"]])}`;
    let color=totalScore>=80?COLORS[2]:(totalScore>=60?COLORS[4]:COLORS[3]);
    plot("taxGauge",[{type:"indicator",mode:"gauge+number",value:totalScore,
      gauge:{axis:{range:[0,100]},bar:{color:color},
        steps:[{range:[0,60],color:"#FADBD8"},{range:[60,80],color:"#FCF3CF"},{range:[80,100],color:"#D5F5E3"}]}}],{height:280,showlegend:false});
    plot("taxScoreChart",[{x:["税负率合理性","进销匹配度","波动稳定性"],y:[score1,score2,score3],type:"bar",
      marker:{color:[COLORS[0],COLORS[1],COLORS[4]]},text:[score1,score2,score3],textposition:"outside"}],{height:200,showlegend:false});
  } else document.getElementById("tax-health").innerHTML="<div class='loading'>暂无税负数据</div>";

  // 进项结构
  if(c.tax.length){
    let rawInput=sum(c.production.map(p=>(p.面料成本+p.辅料成本)))*0.7/1.13*0.13;
    let expInput=sum(c.expense.map(e=>e.金额))*0.3/1.13*0.13;
    let assetInput=Math.max(0,totalInput-rawInput-expInput);
    document.getElementById("tax-input").innerHTML=`
      <div class="section-header">进项结构分析</div>
      <div class="table-wrap">${tableHtml([{进项类型:"原材料进项",金额:Math.round(rawInput),占比:fmtPct(rawInput/totalInput)},{进项类型:"费用进项",金额:Math.round(expInput),占比:fmtPct(expInput/totalInput)},{进项类型:"固定资产进项",金额:Math.round(assetInput),占比:fmtPct(assetInput/totalInput)}],[{key:"进项类型"},{key:"金额"},{key:"占比"}])}</div>
      <div class="chart-box"><div id="inputPie" class="plot-chart" style="height:350px;"></div></div>
      ${insightHtml("进项结构分析",[["info",`原材料进项占比 ${fmtPct(rawInput/totalInput)}，是进项主要来源。`],["info",`费用进项占比 ${fmtPct(expInput/totalInput)}，建议提升费用类专票取得率。`]])}`;
    plot("inputPie",[{labels:["原材料进项","费用进项","固定资产进项"],values:[rawInput,expInput,assetInput],type:"pie",hole:0.4,
      marker:{colors:[COLORS[0],COLORS[1],COLORS[4]]},textinfo:"label+percent+value"}],{height:350,showlegend:false});
  } else document.getElementById("tax-input").innerHTML="<div class='loading'>暂无税负数据</div>";

  // 预警模型
  if(c.tax.length){
    let ymGroups=groupBy(c.tax,t=>t.年月);
    let keys=Object.keys(ymGroups).sort();
    let warnRows=keys.map(k=>{let g=ymGroups[k];let o=sum(g.map(t=>t.增值税销项));let vat=sum(g.map(t=>t.应纳增值税));let r=o?vat/(o/0.13):0;
      return {年月:k,销项:Math.round(o),进项:Math.round(sum(g.map(t=>t.增值税进项))),应纳:Math.round(vat),税负率:fmtPct(r),预警:r<0.01?"偏低-进项积压或隐瞒收入":(r>0.05?"偏高-进项不足或定价偏低":"正常")};});
    let warnList=warnRows.filter(r=>r.预警!=="正常");
    document.getElementById("tax-warn").innerHTML=`
      <div class="section-header">税负预警模型（&lt;1%或&gt;5%触发）</div>
      <div class="table-wrap">${tableHtml(warnRows,[{key:"年月"},{key:"销项"},{key:"进项"},{key:"应纳"},{key:"税负率"},{key:"预警"}])}</div>
      <div class="chart-box"><div id="taxWarnChart" class="plot-chart"></div></div>
      ${warnList.length?warnList.map(r=>alertHtml(r.预警.includes("偏低")?"danger":"warning",`⚠️ ${r.年月}：增值税税负率 ${r.税负率} — ${r.预警}`)).join(""):""}
      ${insightHtml("税负预警分析",[["info",`报告期内 ${warnRows.length} 个月，其中 ${warnList.filter(r=>r.预警.includes("偏低")).length} 个月偏低，${warnList.filter(r=>r.预警.includes("偏高")).length} 个月偏高。`]])}`;
    plot("taxWarnChart",[{x:keys,y:warnRows.map(r=>parseFloat(r.税负率)),type:"scatter",mode:"lines+markers",
      marker:{size:10,color:warnRows.map(r=>parseFloat(r.税负率)<0.01||parseFloat(r.税负率)>0.05?COLORS[3]:COLORS[2])},
      line:{color:COLORS[0],width:2.5}}],{yaxis:{title:"增值税税负率",tickformat:".1%"},height:400,
      shapes:[{type:"line",y0:0.01,y1:0.01,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[3]}},{type:"line",y0:0.05,y1:0.05,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[3]}}]});
  } else document.getElementById("tax-warn").innerHTML="<div class='loading'>暂无税负数据</div>";

  // 节税空间
  if(c.tax.length){
    let microSaving=taxableRev*1.13<=3e8?totalIncomeTax-taxableRev*0.08*0.05:0;
    let rdExpense=taxableRev*0.03, rdSaving=rdExpense*1.0*0.25;
    let inputSaving=totalInput*0.10;
    let totalSaving=microSaving+rdSaving+inputSaving;
    let optimalTax=totalTax-totalSaving;
    document.getElementById("tax-saving").innerHTML=`
      <div class="section-header">节税空间测算</div>
      <div class="table-wrap">${tableHtml([{措施:"小微企业优惠",节税金额:Math.round(microSaving),说明:"利润减按25%计入，税率20%"},{措施:"研发费用加计扣除",节税金额:Math.round(rdSaving),说明:`研发投入${fmtMoney(rdExpense)}，加计100%`},{措施:"进项发票优化",节税金额:Math.round(inputSaving),说明:"提升10%专票取得率"},{措施:"合计",节税金额:Math.round(totalSaving),说明:`理论最优税负${fmtMoney(optimalTax)}`}],[{key:"措施"},{key:"节税金额"},{key:"说明"}])}</div>
      <div class="chart-box"><div id="savingChart" class="plot-chart" style="height:350px;"></div></div>
      ${insightHtml("节税空间测算",[["good",`理论可节税 ${fmtMoney(totalSaving)}，占比 ${fmtPct(totalSaving/totalTax)}。`],["info",`研发费用加计扣除可节税 ${fmtMoney(rdSaving)}。`],["warn","节税措施需合法合规，建议咨询专业税务顾问。"]])}`;
    plot("savingChart",[{x:["当前税负","优化后税负"],y:[totalTax,optimalTax],type:"bar",
      marker:{color:[COLORS[3],COLORS[2]]},text:[fmtMoney(totalTax),fmtMoney(optimalTax)],textposition:"outside"}],{yaxis:{title:"税额(元)"},height:350,showlegend:false});
  } else document.getElementById("tax-saving").innerHTML="<div class='loading'>暂无税负数据</div>";
}

/* ============================================================
   模块5：定价与单价分析
============================================================ */
function renderPricing(){
  let c=FILTERED;
  let html='<div class="module-header">🏷️ 模块5：定价与单价分析</div>';
  html+=`<div class="tabs"><button class="tab active" onclick="switchTab(this,'price-matrix')">价格带矩阵</button>
    <button class="tab" onclick="switchTab(this,'price-discount')">折扣深度</button>
    <button class="tab" onclick="switchTab(this,'price-elastic')">价格弹性</button>
    <button class="tab" onclick="switchTab(this,'price-competitor')">竞品参考</button></div>`;
  html+='<div id="price-matrix" class="tab-content active"></div><div id="price-discount" class="tab-content"></div><div id="price-elastic" class="tab-content"></div><div id="price-competitor" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  if(c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let skuGroups=groupBy(valid,o=>o.SKU);
    let skuStats=Object.keys(skuGroups).map(sku=>{
      let rows=skuGroups[sku], qty=sum(rows.map(r=>r.数量)), sales=sum(rows.map(r=>r.实付金额));
      let unitPrice=qty?sales/qty:0, unitCost=c.production.length?(mean(c.production.filter(p=>p.SKU===sku).map(p=>p.单件生产成本))||unitPrice*0.45):unitPrice*0.45;
      return {SKU:sku,销量:qty,销售额:sales,平均单价:round(unitPrice,2),单位成本:round(unitCost,2),毛利率:unitPrice?(unitPrice-unitCost)/unitPrice:0};
    }).filter(r=>r.销量>0);
    let medQty=median(skuStats.map(r=>r.销量)), medMar=median(skuStats.map(r=>r.毛利率));
    let maxSales=Math.max(...skuStats.map(r=>r.销售额));
    document.getElementById("price-matrix").innerHTML=`
      <div class="section-header">价格带矩阵：销量 × 毛利率，气泡=销售额</div>
      <div class="chart-box"><div id="matrixChart" class="plot-chart"></div></div>
      <div class="table-wrap">${tableHtml(skuStats.sort((a,b)=>b.销售额-a.销售额).slice(0,20),[{key:"SKU"},{key:"销量"},{key:"销售额"},{key:"平均单价"},{key:"单位成本"},{key:"毛利率"}])}</div>
      ${insightHtml("价格带矩阵分析",[["good",`明星产品 ${skuStats.filter(r=>r.销量>=medQty&&r.毛利率>=medMar).length} 个，应加大投入。`],["warn","瘦狗产品建议淘汰或改造。"]])}`;
    plot("matrixChart",[{x:skuStats.map(r=>r.销量),y:skuStats.map(r=>r.毛利率),text:skuStats.map(r=>r.SKU),
      mode:"markers",type:"scatter",marker:{size:skuStats.map(r=>r.销售额/maxSales*40+8),color:skuStats.map(r=>r.毛利率),colorscale:"RdYlGn",showscale:true,line:{color:COLORS[0],width:1}},
      hovertemplate:"<b>%{text}</b><br>销量: %{x}<br>毛利率: %{y:.1%}<extra></extra>"}],
      {xaxis:{title:"销量(件)"},yaxis:{title:"毛利率",tickformat:".0%"},
       shapes:[{type:"line",y0:medMar,y1:medMar,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[7]}},{type:"line",x0:medQty,x1:medQty,y0:0,y1:1,yref:"paper",line:{dash:"dash",color:COLORS[7]}}],
       annotations:[{x:medQty*1.5,y:medMar*1.3,text:"⭐ 明星",showarrow:false,font:{color:COLORS[2],size:14}},{x:medQty*0.5,y:medMar*1.3,text:"❓ 问题",showarrow:false,font:{color:COLORS[4],size:14}},{x:medQty*1.5,y:medMar*0.5,text:"🐄 现金牛",showarrow:false,font:{color:COLORS[0],size:14}},{x:medQty*0.5,y:medMar*0.5,text:"🐕 瘦狗",showarrow:false,font:{color:COLORS[7],size:14}}],height:480});
  } else document.getElementById("price-matrix").innerHTML="<div class='loading'>暂无订单数据</div>";

  // 折扣深度
  if(c.orders.length){
    let platGroups=groupBy(c.orders,o=>o.平台);
    let rows=Object.keys(platGroups).map(p=>{let rows=platGroups[p];let orig=mean(rows.map(r=>r.原价)),paid=mean(rows.map(r=>r.实付金额));
      return {平台:p,原价均值:round(orig,2),实付均值:round(paid,2),平均折扣率:fmtPct(1-paid/orig),订单数:rows.length};});
    document.getElementById("price-discount").innerHTML=`
      <div class="section-header">折扣深度分析：原价 vs 实付</div>
      <div class="table-wrap">${tableHtml(rows,[{key:"平台"},{key:"原价均值"},{key:"实付均值"},{key:"平均折扣率"},{key:"订单数"}])}</div>
      <div class="chart-box"><div id="discountChart" class="plot-chart"></div></div>
      ${insightHtml("折扣深度分析",[["info",`折扣最深渠道 ${rows.sort((a,b)=>parseFloat(b.平均折扣率)-parseFloat(a.平均折扣率))[0].平台}（${rows.sort((a,b)=>parseFloat(b.平均折扣率)-parseFloat(a.平均折扣率))[0].平均折扣率}）。`]])}`;
    plot("discountChart",[
      {x:rows.map(r=>r.平台),y:rows.map(r=>r.原价均值),name:"原价均值",type:"bar",marker:{color:COLORS[0]}},
      {x:rows.map(r=>r.平台),y:rows.map(r=>r.实付均值),name:"实付均值",type:"bar",marker:{color:COLORS[1]}}
    ],{barmode:"group",yaxis:{title:"金额(元)"},height:380});

    // 价格弹性
    let validE=c.orders.filter(o=>!o.是否退货);
    validE.forEach(o=>o.单价=o.数量?o.实付金额/o.数量:0);
    let bins=[0,50,100,150,200,300,500], labels=["0-50","50-100","100-150","150-200","200-300","300+"];
    let elasticRows=labels.map((lb,i)=>{let sub=validE.filter(o=>o.单价>=bins[i]&&(i<bins.length-1?o.单价<bins[i+1]:true));
      return {价格区间:lb,订单数:sub.length,销量:sum(sub.map(o=>o.数量)),销售额:Math.round(sum(sub.map(o=>o.实付金额))),退货率:fmtPct(sub.length?mean(c.orders.filter(o=>o.单价>=bins[i]&&(i<bins.length-1?o.单价<bins[i+1]:true)).map(o=>o.是否退货)):0),利润率:fmtPct(0.4-i*0.02)};});
    document.getElementById("price-elastic").innerHTML=`
      <div class="section-header">价格弹性：不同价格区间表现对比</div>
      <div class="table-wrap">${tableHtml(elasticRows,[{key:"价格区间"},{key:"订单数"},{key:"销量"},{key:"销售额"},{key:"退货率"},{key:"利润率"}])}</div>
      <div class="chart-box"><div id="elasticChart" class="plot-chart"></div></div>
      ${insightHtml("价格弹性分析",[["info",`销售额最高区间 ${elasticRows.sort((a,b)=>b.销售额-a.销售额)[0].价格区间}元。`]])}`;
    plot("elasticChart",[
      {x:elasticRows.map(r=>r.价格区间),y:elasticRows.map(r=>r.销售额),name:"销售额",type:"bar",marker:{color:COLORS[0]}},
      {x:elasticRows.map(r=>r.价格区间),y:elasticRows.map(r=>r.订单数),name:"订单数",type:"bar",yaxis:"y2",marker:{color:COLORS[1]}}
    ],{yaxis:{title:"销售额"},yaxis2:{title:"订单数",overlaying:"y",side:"right"},barmode:"group",height:380});
  } else { document.getElementById("price-discount").innerHTML="<div class='loading'>暂无订单数据</div>"; document.getElementById("price-elastic").innerHTML="<div class='loading'>暂无订单数据</div>"; }

  document.getElementById("price-competitor").innerHTML=`
    <div class="section-header">竞品定价参考区（预留接口）</div>
    ${alertHtml("info","ℹ️ 本区域为竞品定价数据预留接口，可通过接入竞品价格API或上传竞品价格表实现对比分析。")}
    <div class="table-wrap">${tableHtml([{竞品SKU:"竞品A-T恤",竞品价格:89,本品价格:99,价差:-10,价差率:"-11.2%"},{竞品SKU:"竞品B-连衣裙",竞品价格:189,本品价格:159,价差:30,价差率:"+18.9%"},{竞品SKU:"竞品C-外套",竞品价格:299,本品价格:259,价差:40,价差率:"+15.4%"}],[{key:"竞品SKU"},{key:"竞品价格"},{key:"本品价格"},{key:"价差"},{key:"价差率"}])}</div>

function median(arr){ if(!arr.length) return 0; let s=[...arr].sort((a,b)=>a-b); let m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; }

/* ============================================================
   模块6：运费与物流分析
============================================================ */
function renderLogistics(){
  let c=FILTERED;
  let html='<div class="module-header">🚚 模块6：运费与物流分析</div>';
  html+=`<div class="tabs"><button class="tab active" onclick="switchTab(this,'log-cost')">成本结构</button>
    <button class="tab" onclick="switchTab(this,'log-unit')">单件运费</button>
    <button class="tab" onclick="switchTab(this,'log-return')">退换货损失</button>
    <button class="tab" onclick="switchTab(this,'log-opt')">优化建议</button></div>`;
  html+='<div id="log-cost" class="tab-content active"></div><div id="log-unit" class="tab-content"></div><div id="log-return" class="tab-content"></div><div id="log-opt" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  // 物流成本结构
  if(c.logistics.length){
    let expressTotal=sum(c.logistics.map(l=>l.快递费));
    let warehousing=sum(c.expense.filter(e=>e.费用类型==="物流费").map(e=>e.金额))*0.3;
    let packing=expressTotal*0.15;
    let returnFreight=sum(c.orders.filter(o=>o.是否退货).map(o=>o.运费))*2;
    document.getElementById("log-cost").innerHTML=`
      <div class="section-header">物流成本结构</div>
      <div class="table-wrap">${tableHtml([{成本项:"快递费",金额:Math.round(expressTotal),占比:fmtPct(expressTotal/(expressTotal+warehousing+packing+returnFreight))},{成本项:"仓储费",金额:Math.round(warehousing),占比:fmtPct(warehousing/(expressTotal+warehousing+packing+returnFreight))},{成本项:"包材费",金额:Math.round(packing),占比:fmtPct(packing/(expressTotal+warehousing+packing+returnFreight))},{成本项:"退换货运费",金额:Math.round(returnFreight),占比:fmtPct(returnFreight/(expressTotal+warehousing+packing+returnFreight))}],[{key:"成本项"},{key:"金额"},{key:"占比"}])}</div>
      <div class="chart-box"><div id="logCostPie" class="plot-chart" style="height:350px;"></div></div>
      ${insightHtml("物流成本结构分析",[["info",`物流总成本 ${fmtMoney(expressTotal+warehousing+packing+returnFreight)}，快递费占比最高。`],["warn",`退换货运费 ${fmtMoney(returnFreight)} 是隐性成本，建议降低退货率。`]])}`;
    plot("logCostPie",[{labels:["快递费","仓储费","包材费","退换货运费"],values:[expressTotal,warehousing,packing,returnFreight],type:"pie",hole:0.4,
      marker:{colors:[COLORS[0],COLORS[1],COLORS[4],COLORS[3]]},textinfo:"label+percent+value"}],{height:350,showlegend:false});
  } else document.getElementById("log-cost").innerHTML="<div class='loading'>暂无物流数据</div>";

  // 单件运费
  if(c.logistics.length){
    let l=c.logistics;
    l.forEach(x=>x.重量段=x.重量<0.5?"<0.5kg":(x.重量<1?"0.5-1kg":(x.重量<1.5?"1-1.5kg":(x.重量<2?"1.5-2kg":">2kg"))));
    let weightGroups=groupBy(l,x=>x.重量段);
    let regionGroups=groupBy(l,x=>x.区域);
    let courierGroups=groupBy(l,x=>x.快递公司);
    let weightRows=Object.keys(weightGroups).map(k=>({重量段:k,平均运费:round(mean(weightGroups[k].map(x=>x.快递费)),1),单量:weightGroups[k].length}));
    let regionRows=Object.keys(regionGroups).map(k=>({区域:k,平均运费:round(mean(regionGroups[k].map(x=>x.快递费)),1),单量:regionGroups[k].length})).sort((a,b)=>b.平均运费-a.平均运费);
    let courierRows=Object.keys(courierGroups).map(k=>({快递公司:k,平均运费:round(mean(courierGroups[k].map(x=>x.快递费)),1),单量:courierGroups[k].length})).sort((a,b)=>a.平均运费-b.平均运费);
    document.getElementById("log-unit").innerHTML=`
      <div class="section-header">单件物流成本（按重量段/区域/快递公司）</div>
      <div class="chart-row cols-3">
        <div class="chart-box"><div class="chart-title">按重量段</div><div id="weightChart" class="plot-chart" style="height:280px;"></div></div>
        <div class="chart-box"><div class="chart-title">按区域</div><div id="regionChart" class="plot-chart" style="height:280px;"></div></div>
        <div class="chart-box"><div class="chart-title">按快递公司</div><div id="courierChart" class="plot-chart" style="height:280px;"></div></div>
      </div>
      ${insightHtml("单件物流成本分析",[["info",`运费最高区域 ${regionRows[0].区域}（${regionRows[0].平均运费}元/件）。`],["good",`性价比最高快递 ${courierRows[0].快递公司}（${courierRows[0].平均运费}元/件）。`]])}`;
    plot("weightChart",[{x:weightRows.map(r=>r.重量段),y:weightRows.map(r=>r.平均运费),type:"bar",marker:{color:COLORS[0]},text:weightRows.map(r=>r.平均运费),textposition:"outside"}],{yaxis:{title:"平均运费(元)"},height:280,showlegend:false});
    plot("regionChart",[{x:regionRows.map(r=>r.区域),y:regionRows.map(r=>r.平均运费),type:"bar",marker:{color:COLORS[1]},text:regionRows.map(r=>r.平均运费),textposition:"outside"}],{yaxis:{title:"平均运费(元)"},height:280,showlegend:false});
    plot("courierChart",[{x:courierRows.map(r=>r.快递公司),y:courierRows.map(r=>r.平均运费),type:"bar",marker:{color:COLORS[4]},text:courierRows.map(r=>r.平均运费),textposition:"outside"}],{yaxis:{title:"平均运费(元)"},height:280,showlegend:false});
  } else document.getElementById("log-unit").innerHTML="<div class='loading'>暂无物流数据</div>";

  // 退换货损失
  if(c.orders.length){
    let returnOrders=c.orders.filter(o=>o.是否退货);
    let returnRate=c.orders.length?returnOrders.length/c.orders.length:0;
    let avgUnitCost=c.production.length?mean(c.production.map(p=>p.单件生产成本)):50;
    let avgFreight=mean(c.orders.map(o=>o.运费));
    let returnQty=sum(returnOrders.map(o=>o.数量));
    let goodsLoss=returnQty*avgUnitCost, freightLoss=returnOrders.length*avgFreight*2, handlingLoss=returnOrders.length*5;
    let totalLoss=goodsLoss+freightLoss+handlingLoss;
    document.getElementById("log-return").innerHTML=`
      <div class="section-header">退换货损失量化</div>
      <div class="kpi-grid cols-4">
        <div class="kpi-card ${returnRate>0.25?'danger':''}"><div class="kpi-label">退货率</div><div class="kpi-value">${fmtPct(returnRate)}</div><div class="kpi-delta">基准 ${fmtPct(BENCH.returnRate)}</div></div>
        <div class="kpi-card"><div class="kpi-label">退货件数</div><div class="kpi-value">${returnQty.toLocaleString()}件</div><div class="kpi-delta">退货单${returnOrders.length}笔</div></div>
        <div class="kpi-card accent"><div class="kpi-label">退货商品损失</div><div class="kpi-value">${fmtMoney(goodsLoss)}</div><div class="kpi-delta">单价${Math.round(avgUnitCost)}元</div></div>
        <div class="kpi-card danger"><div class="kpi-label">退换货总损失</div><div class="kpi-value">${fmtMoney(totalLoss)}</div><div class="kpi-delta">商品+运费+处理</div></div>
      </div>
      <div class="chart-box"><div id="returnChart" class="plot-chart"></div></div>
      ${insightHtml("退换货损失分析",[["warn",`整体退货率 ${fmtPct(returnRate)}，高于基准 ${fmtPct(BENCH.returnRate)}，总损失 ${fmtMoney(totalLoss)}。`],["warn","建议加强尺码指导、品控，降低退货率。"]])}`;
    let platReturn=Object.entries(groupBy(c.orders,o=>o.平台)).map(([p,rows])=>({平台:p,退货率:fmtPct(rows.filter(r=>r.是否退货).length/rows.length),退货损失:Math.round(sum(rows.filter(r=>r.是否退货).map(r=>r.数量))*avgUnitCost+rows.filter(r=>r.是否退货).length*avgFreight*2)}));
    plot("returnChart",[{x:platReturn.map(r=>r.平台),y:platReturn.map(r=>r.退货损失),type:"bar",marker:{color:COLORS[3]},text:platReturn.map(r=>r.退货损失),textposition:"outside"}],{yaxis:{title:"损失金额(元)"},height:350,showlegend:false});
  } else document.getElementById("log-return").innerHTML="<div class='loading'>暂无订单数据</div>";

  // 优化建议
  if(c.logistics.length){
    let suggestions=[];
    let regionCost={};
    c.logistics.forEach(l=>{(regionCost[l.区域]=regionCost[l.区域]||[]).push(l.快递费);});
    let avgCost=mean(c.logistics.map(l=>l.快递费));
    let courierCost={};
    c.logistics.forEach(l=>{(courierCost[l.快递公司]=courierCost[l.快递公司]||[]).push(l.快递费);});
    let cheapestCourier=Object.entries(courierCost).map(([k,v])=>({k,avg:mean(v)})).sort((a,b)=>a.avg-b.avg)[0];
    Object.entries(regionCost).forEach(([region,costs])=>{let rAvg=mean(costs); if(rAvg>avgCost*1.2){suggestions.push(["warn",`${region}区域单件运费 ${rAvg.toFixed(1)} 元，高于均值20%，建议切换至 ${cheapestCourier.k}（${cheapestCourier.avg.toFixed(1)}元/件）。`]);}});
    let courierShare={};
    c.logistics.forEach(l=>courierShare[l.快递公司]=(courierShare[l.快递公司]||0)+1);
    Object.entries(courierShare).forEach(([k,v])=>{let share=v/c.logistics.length; if(share>0.3){suggestions.push(["info",`${k}占比 ${fmtPct(share)} 较高，建议分散风险。`]);}});
    if(!suggestions.length) suggestions.push(["good","当前物流成本结构合理，暂无显著优化点。"]);
    document.getElementById("log-opt").innerHTML=`
      <div class="section-header">物流优化建议（自动生成）</div>
      ${suggestions.map(s=>alertHtml(s[0]==="warn"?"warning":"info","💡 "+s[1])).join("")}
      ${insightHtml("物流优化建议",suggestions)}`;
  } else document.getElementById("log-opt").innerHTML="<div class='loading'>暂无物流数据</div>";
}

/* ============================================================

============================================================ */
function renderPromotion(){
  let c=FILTERED, m=MONTHLY.filter(r=>r.年月>=dateFilter[0].substring(0,7)&&r.年月<=dateFilter[1].substring(0,7));
  let html='<div class="module-header">📢 模块7：推广投放效率</div>';
  html+=`<div class="tabs"><button class="tab active" onclick="switchTab(this,'promo-roi')">全渠道ROI</button>
    <button class="tab" onclick="switchTab(this,'promo-cac')">CAC趋势</button>
    <button class="tab" onclick="switchTab(this,'promo-ctrl')">费率控制</button>
    <button class="tab" onclick="switchTab(this,'promo-marginal')">边际ROI</button>
    <button class="tab" onclick="switchTab(this,'promo-sku')">爆款效率</button></div>`;
  html+='<div id="promo-roi" class="tab-content active"></div><div id="promo-cac" class="tab-content"></div><div id="promo-ctrl" class="tab-content"></div><div id="promo-marginal" class="tab-content"></div><div id="promo-sku" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  // ROI对比
  if(c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let platGroups=groupBy(valid,o=>o.平台);
    let rows=Object.keys(platGroups).map(p=>{let rows=platGroups[p];let sales=sum(rows.map(r=>r.实付金额)),promo=sum(rows.map(r=>r.推广费分摊));
      return {平台:p,销售额:Math.round(sales),推广费:Math.round(promo),订单数:rows.length,ROI:round(sales/promo,1),推广费率:fmtPct(promo/sales)};});
    rows.sort((a,b)=>b.ROI-a.ROI);
    document.getElementById("promo-roi").innerHTML=`
      <div class="section-header">全渠道 ROI 对比（ROI = 销售额 / 推广费）</div>
      <div class="table-wrap">${tableHtml(rows,[{key:"平台"},{key:"销售额"},{key:"推广费"},{key:"订单数"},{key:"ROI"},{key:"推广费率"}])}</div>
      <div class="chart-box"><div id="roiChart" class="plot-chart"></div></div>
      ${insightHtml("全渠道ROI分析",[["good",`ROI最高渠道 ${rows[0].平台}（ROI ${rows[0].ROI}）。`],["warn",`ROI最低渠道 ${rows[rows.length-1].平台}（ROI ${rows[rows.length-1].ROI}），建议优化。`]])}`;
    plot("roiChart",[{x:rows.map(r=>r.平台),y:rows.map(r=>r.ROI),type:"bar",marker:{color:COLORS[2]},text:rows.map(r=>r.ROI),textposition:"outside"}],{yaxis:{title:"ROI"},height:350,showlegend:false});
  } else document.getElementById("promo-roi").innerHTML="<div class='loading'>暂无订单数据</div>";

  // CAC趋势
  if(c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let ymPlat={};
    valid.forEach(o=>{let k=o.年月+"|"+o.平台;(ymPlat[k]=ymPlat[k]||{推广费:0,订单数:0});ymPlat[k].推广费+=o.推广费分摊;ymPlat[k].订单数++;});
    let ymKeys=[...new Set(valid.map(o=>o.年月))].sort();
    let plats=[...new Set(valid.map(o=>o.平台))];
    let traces=plats.map((p,i)=>({x:ymKeys,y:ymKeys.map(k=>{let r=ymPlat[k+"|"+p];return r&&r.订单数?r.推广费/r.订单数:null;}),name:p,type:"scatter",mode:"lines+markers",line:{color:COLORS[i]}}));
    document.getElementById("promo-cac").innerHTML=`
      <div class="section-header">CAC 获客成本趋势（分渠道）</div>
      <div class="chart-box"><div id="cacChart" class="plot-chart"></div></div>
      ${insightHtml("CAC趋势分析",[["info","CAC持续上升说明获客成本增加，需优化投放精准度。"]])}`;
    plot("cacChart",traces,{yaxis:{title:"CAC获客成本(元)"},height:400});
  } else document.getElementById("promo-cac").innerHTML="<div class='loading'>暂无订单数据</div>";

  // 费率控制线
  if(m.length){
    document.getElementById("promo-ctrl").innerHTML=`
      <div class="section-header">推广费率控制线（上限 ${fmtPct(BENCH.promoRateMax)}）</div>
      <div class="chart-box"><div id="promoCtrlChart" class="plot-chart"></div></div>
      ${insightHtml("推广费率控制分析",m.filter(r=>r.推广费率>BENCH.promoRateMax).length?[["bad",`共 ${m.filter(r=>r.推广费率>BENCH.promoRateMax).length} 个月推广费率超限，需缩减低效投放。`]]:[["good","所有月份推广费率均控制在合理范围内。"]])}`;
    plot("promoCtrlChart",[{x:m.map(r=>r.年月),y:m.map(r=>r.推广费率),type:"bar",
      marker:{color:m.map(r=>r.推广费率>BENCH.promoRateMax?COLORS[3]:COLORS[2])}}],{yaxis:{title:"推广费率",tickformat:".0%"},height:380,
      shapes:[{type:"line",y0:BENCH.promoRateMax,y1:BENCH.promoRateMax,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[3]}}]});
  } else document.getElementById("promo-ctrl").innerHTML="<div class='loading'>暂无数据</div>";

  // 边际ROI
  if(m.length){
    let margRows=m.map((r,i)=>({年月:r.年月,推广费:Math.round(r.推广费合计),销售额:Math.round(r.净销售额),
      边际ROI:i>0&&m[i-1].推广费合计?(r.净销售额-m[i-1].净销售额)/(r.推广费合计-m[i-1].推广费合计):null}));
    document.getElementById("promo-marginal").innerHTML=`
      <div class="section-header">推广-销售相关性 & 边际 ROI</div>
      <div class="table-wrap">${tableHtml(margRows,[{key:"年月"},{key:"推广费"},{key:"销售额"},{key:"边际ROI"}])}</div>
      <div class="chart-box"><div id="marginalChart" class="plot-chart"></div></div>
      ${insightHtml("边际ROI分析",[["info","边际ROI<1表示新增推广投入回报不足，应停止加投。"]])}`;
    plot("marginalChart",[{x:margRows.map(r=>r.年月),y:margRows.map(r=>r.边际ROI),type:"bar",
      marker:{color:margRows.map(r=>r.边际ROI&&r.边际ROI>0?COLORS[2]:COLORS[3])}}],{yaxis:{title:"边际ROI"},height:350,showlegend:false,
      shapes:[{type:"line",y0:1,y1:1,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[4]}}]});
  } else document.getElementById("promo-marginal").innerHTML="<div class='loading'>暂无数据</div>";

  // 爆款效率
  if(c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let skuGroups=groupBy(valid,o=>o.SKU);
    let rows=Object.keys(skuGroups).map(sku=>{let rows=skuGroups[sku];let sales=sum(rows.map(r=>r.实付金额)),promo=sum(rows.map(r=>r.推广费分摊)),qty=sum(rows.map(r=>r.数量));
      return {SKU:sku,销售额:Math.round(sales),推广费:Math.round(promo),销量:qty,ROI:round(sales/promo,1)};}).sort((a,b)=>b.ROI-a.ROI).slice(0,20);
    document.getElementById("promo-sku").innerHTML=`
      <div class="section-header">爆款推广效率排名（分SKU）</div>
      <div class="table-wrap">${tableHtml(rows,[{key:"SKU"},{key:"销售额"},{key:"推广费"},{key:"销量"},{key:"ROI"}])}</div>
      <div class="chart-box"><div id="skuPromoChart" class="plot-chart"></div></div>
      ${insightHtml("爆款推广效率分析",[["good",`推广效率最高SKU ${rows[0].SKU}（ROI ${rows[0].ROI}），建议加大投放。`]])}`;
    plot("skuPromoChart",[{x:rows.map(r=>r.SKU),y:rows.map(r=>r.ROI),type:"bar",marker:{color:COLORS[2]},text:rows.map(r=>r.ROI),textposition:"outside"}],{yaxis:{title:"ROI"},height:400,showlegend:false});
  } else document.getElementById("promo-sku").innerHTML="<div class='loading'>暂无订单数据</div>";
}
