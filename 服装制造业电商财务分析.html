      <div class="kpi-grid cols-4">
        <div class="kpi-card"><div class="kpi-label">平均人数</div><div class="kpi-value">${hc}人</div><div class="kpi-delta">全员</div></div>
        <div class="kpi-card accent"><div class="kpi-label">人均产值</div><div class="kpi-value">${fmtMoney(perOutput)}</div><div class="kpi-delta">净销售${fmtMoney(netSales)}</div></div>
        <div class="kpi-card success"><div class="kpi-label">人均利润</div><div class="kpi-value">${fmtMoney(perProfit)}</div><div class="kpi-delta">净利润${fmtMoney(profit)}</div></div>
        <div class="kpi-card ${laborRate>BENCH.laborCostRate?'danger':'success'}"><div class="kpi-label">人力成本率</div><div class="kpi-value">${fmtPct(laborRate)}</div><div class="kpi-delta">基准${fmtPct(BENCH.laborCostRate)}</div></div>
      </div>
      <div class="chart-box"><div id="peTrendChart" class="plot-chart"></div></div>
      ${insightHtml("全员人效分析",[["info",`全员 ${hc} 人，人均产值 ${fmtMoney(perOutput)}，人均利润 ${fmtMoney(perProfit)}。`]])}`;
    plot("peTrendChart",[
      {x:m.map(r=>r.年月),y:m.map(r=>r.净销售额/hc),name:"人均产值",type:"bar",marker:{color:COLORS[0]}},
      {x:m.map(r=>r.年月),y:m.map(r=>r.净利润/hc),name:"人均利润",type:"scatter",mode:"lines+markers",line:{color:COLORS[1],width:2.5}}
    ],{yaxis:{title:"金额(元)"},height:400});
  } else document.getElementById("pe-overall").innerHTML="<div class='loading'>暂无数据</div>";

  // 分部门
  if(pe.length){
    let deptGroups=groupBy(pe,p=>p.部门);
    let totalSales=m.length?sum(m.map(r=>r.净销售额)):0;
    let contrib={"生产部":0.4,"运营部":0.4,"客服部":0.1,"仓储部":0.05,"管理部":0.03,"设计部":0.02};
    let rows=Object.keys(deptGroups).map(d=>{let rows=deptGroups[d];let cnt=rows.length,sal=sum(rows.map(r=>r.月薪));
      return {部门:d,人数:cnt,月薪总额:Math.round(sal),平均月薪:Math.round(sal/cnt),贡献产值:Math.round(totalSales*(contrib[d]||0)),人均产值:Math.round(totalSales*(contrib[d]||0)/cnt)};}).sort((a,b)=>b.人均产值-a.人均产值);
    document.getElementById("pe-dept").innerHTML=`
      <div class="section-header">分部门人效</div>
      <div class="table-wrap">${tableHtml(rows,[{key:"部门"},{key:"人数"},{key:"月薪总额"},{key:"平均月薪"},{key:"贡献产值"},{key:"人均产值"}])}</div>
      <div class="chart-box"><div id="deptChart" class="plot-chart"></div></div>
      ${insightHtml("分部门人效分析",[["info",`人均产值最高部门 ${rows[0].部门}（${fmtMoney(rows[0].人均产值)}）。`]])}`;
    plot("deptChart",[
      {x:rows.map(r=>r.部门),y:rows.map(r=>r.人数),name:"人数",type:"bar",marker:{color:COLORS[0]}},
      {x:rows.map(r=>r.部门),y:rows.map(r=>r.人均产值),name:"人均产值",type:"bar",yaxis:"y2",marker:{color:COLORS[1]}}
    ],{barmode:"group",yaxis:{title:"人数"},yaxis2:{title:"人均产值(元)",overlaying:"y",side:"right"},height:380});
  } else document.getElementById("pe-dept").innerHTML="<div class='loading'>暂无人员数据</div>";

  // 人力成本结构
  if(pe.length){
    let totalSal=sum(pe.map(p=>p.月薪))*24, social=totalSal*0.30, welfare=totalSal*0.08;
    document.getElementById("pe-cost").innerHTML=`
      <div class="section-header">人力成本结构</div>
      <div class="table-wrap">${tableHtml([{成本项:"薪酬",金额:Math.round(totalSal),占比:fmtPct(totalSal/(totalSal+social+welfare))},{成本项:"社保公积金",金额:Math.round(social),占比:fmtPct(social/(totalSal+social+welfare))},{成本项:"福利",金额:Math.round(welfare),占比:fmtPct(welfare/(totalSal+social+welfare))}],[{key:"成本项"},{key:"金额"},{key:"占比"}])}</div>
      <div class="chart-box"><div id="peCostPie" class="plot-chart" style="height:350px;"></div></div>
      ${insightHtml("人力成本结构分析",[["info",`人力总成本 ${fmtMoney(totalSal+social+welfare)}，社保占比 ${fmtPct(social/(totalSal+social+welfare))}。`]])}`;
    plot("peCostPie",[{labels:["薪酬","社保公积金","福利"],values:[totalSal,social,welfare],type:"pie",hole:0.4,
      marker:{colors:[COLORS[0],COLORS[1],COLORS[4]]},textinfo:"label+percent"}],{height:350,showlegend:false});
  } else document.getElementById("pe-cost").innerHTML="<div class='loading'>暂无人员数据</div>";

  // 人效对标
  if(pe.length&&m.length){
    let totalSales=sum(m.map(r=>r.净销售额)), gmv=sum(m.map(r=>r.GMV));
    let prodCnt=(groupBy(pe,p=>p.部门)["生产部"]||[]).length, opsCnt=(groupBy(pe,p=>p.部门)["运营部"]||[]).length;
    let prodPC=prodCnt?totalSales*0.4/prodCnt:0, opsGMV=opsCnt?gmv/opsCnt:0;
    let laborRate=sum(pe.map(p=>p.月薪))*24/totalSales;
    let benchRows=[
      {指标:"生产岗人均年产值",当前值:fmtMoney(prodPC),行业基准:fmtMoney(BENCH.prodPerCapita),达标情况:prodPC>=BENCH.prodPerCapita?"达标":"未达标"},
      {指标:"运营岗人均GMV",当前值:fmtMoney(opsGMV),行业基准:fmtMoney(BENCH.opsPerCapitaGMV),达标情况:opsGMV>=BENCH.opsPerCapitaGMV?"达标":"未达标"},
      {指标:"全员人均产值",当前值:fmtMoney(totalSales/pe.length),行业基准:"100万/人",达标情况:totalSales/pe.length>=1000000?"达标":"未达标"},
      {指标:"人力成本率",当前值:fmtPct(laborRate),行业基准:fmtPct(BENCH.laborCostRate),达标情况:laborRate<=BENCH.laborCostRate?"达标":"未达标"}
    ];
    document.getElementById("pe-bench").innerHTML=`
      <div class="section-header">人效对标：与行业基准对比</div>
      <div class="table-wrap">${tableHtml(benchRows,[{key:"指标"},{key:"当前值"},{key:"行业基准"},{key:"达标情况"}])}</div>
      ${insightHtml("人效对标分析",benchRows.map(r=>r.达标情况==="达标"?["good",`${r.指标} 达到行业基准。`]:["warn",`${r.指标} 未达基准，当前 ${r.当前值}，基准 ${r.行业基准}。`]))}`;
  } else document.getElementById("pe-bench").innerHTML="<div class='loading'>暂无数据</div>";

  // 人效预警
  if(m.length>=3&&pe.length){
    let hc=pe.length;
    let rows=m.map(r=>({年月:r.年月,人均产值:Math.round(r.净销售额/hc),环比:m.indexOf(r)>0&&m[m.indexOf(r)-1].净销售额?(r.净销售额-m[m.indexOf(r)-1].净销售额)/m[m.indexOf(r)-1].净销售额:0}));
    let alerts=[];
    for(let i=2;i<rows.length;i++){ if(rows[i].环比<-0.1&&rows[i-1].环比<-0.1){ alerts.push(["danger",`${rows[i].年月}：人均产值连续两月下滑超10%，当前 ${fmtMoney(rows[i].人均产值)}。`]); } }
    document.getElementById("pe-warn").innerHTML=`
      <div class="section-header">人效预警（连续两月下滑>10%）</div>
      <div class="chart-box"><div id="peWarnChart" class="plot-chart"></div></div>
      ${alerts.length?alerts.map(a=>alertHtml("danger","⚠️ "+a[1])).join(""):"<div class='alert-box alert-success'>未检测到连续两月人效下滑超10%。</div>"}
      ${insightHtml("人效预警分析",alerts.length?alerts:[["good","人效稳定，无连续下滑预警。"]])}`;
    plot("peWarnChart",[{x:rows.map(r=>r.年月),y:rows.map(r=>r.环比),type:"bar",
      marker:{color:rows.map(r=>r.环比<-0.1?COLORS[3]:COLORS[2])}}],{yaxis:{title:"环比变化率",tickformat:".0%"},height:380,showlegend:false,
      shapes:[{type:"line",y0:-0.1,y1:-0.1,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[3]}}]});
  } else document.getElementById("pe-warn").innerHTML="<div class='loading'>数据不足</div>";
}

/* ============================================================
   模块9：库存与资金
============================================================ */
function renderInventory(){
  let c=FILTERED, m=MONTHLY.filter(r=>r.年月>=dateFilter[0].substring(0,7)&&r.年月<=dateFilter[1].substring(0,7));
  let html='<div class="module-header">📦 模块9：库存与资金</div>';
  html+=`<div class="tabs"><button class="tab active" onclick="switchTab(this,'inv-health')">健康度评分</button>
    <button class="tab" onclick="switchTab(this,'inv-abc')">ABC分类</button>
    <button class="tab" onclick="switchTab(this,'inv-capital')">资金占用</button>
    <button class="tab" onclick="switchTab(this,'inv-turnover')">周转趋势</button>
    <button class="tab" onclick="switchTab(this,'inv-safety')">安全库存</button></div>`;
  html+='<div id="inv-health" class="tab-content active"></div><div id="inv-abc" class="tab-content"></div><div id="inv-capital" class="tab-content"></div><div id="inv-turnover" class="tab-content"></div><div id="inv-safety" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  let inv=c.inventory||[];
  if(inv.length){
    let totalStock=sum(inv.map(r=>r.库存金额)), avgAge=mean(inv.map(r=>r.库龄天数));
    let slow=inv.filter(r=>r.库龄天数>90), slowRate=slow.length/inv.length;
    let stockout=inv.filter(r=>r.期末库存===0), stockoutRate=stockout.length/inv.length;
    let cogs=m.length?sum(m.map(r=>r.销售成本)):1;
    let turnoverDays=cogs>0?totalStock/cogs*365:0;
    let sTurn=Math.max(0,40-Math.max(0,turnoverDays-60)*0.5), sSlow=30*(1-slowRate), sStock=15*(1-stockoutRate), sAge=15*(1-Math.min(1,avgAge/180));
    let totalScore=sTurn+sSlow+sStock+sAge;
    let level=totalScore>=70?"健康":(totalScore>=50?"关注":"风险");
    document.getElementById("inv-health").innerHTML=`
      <div class="section-header">库存健康度评分（综合周转/滞销/缺货/库龄）</div>
      <div class="chart-row cols-3-2">
        <div class="chart-box"><div id="invGauge" class="plot-chart"></div></div>
        <div class="chart-box">
          <div class="table-wrap">${tableHtml([{维度:"周转天数",得分:round(sTurn,1),指标值:Math.round(turnoverDays)+"天"},{维度:"滞销率",得分:round(sSlow,1),指标值:fmtPct(slowRate)},{维度:"缺货率",得分:round(sStock,1),指标值:fmtPct(stockoutRate)},{维度:"库龄",得分:round(sAge,1),指标值:Math.round(avgAge)+"天"},{维度:"总分",得分:round(totalScore,1),指标值:"-"}],[{key:"维度"},{key:"得分"},{key:"指标值"}])}</div>
        </div>
      </div>
      ${insightHtml("库存健康度分析",[["info",`库存健康度评分 ${round(totalScore,0)} 分，评级 ${level}。`],slowRate>0.2?["warn","滞销率偏高，建议清仓促销。"]:["good","滞销率可控。"]])}`;
    let color=totalScore>=70?COLORS[2]:(totalScore>=50?COLORS[4]:COLORS[3]);
    plot("invGauge",[{type:"indicator",mode:"gauge+number",value:totalScore,
      gauge:{axis:{range:[0,100]},bar:{color:color},steps:[{range:[0,50],color:"#FADBD8"},{range:[50,70],color:"#FCF3CF"},{range:[70,100],color:"#D5F5E3"}]}}],{height:280,showlegend:false});
  } else document.getElementById("inv-health").innerHTML="<div class='loading'>暂无库存数据</div>";

  // ABC分类
  if(inv.length&&c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let skuGroups=groupBy(valid,o=>o.SKU);
    let skuSales=Object.keys(skuGroups).map(sku=>({SKU:sku,销售额:sum(skuGroups[sku].map(o=>o.实付金额))})).sort((a,b)=>b.销售额-a.销售额);
    let total=sum(skuSales.map(r=>r.销售额)), cum=0;
    skuSales.forEach(r=>{cum+=r.销售额;r.累计占比=cum/total;r.ABC分类=cum/total<=0.8?"A":(cum/total<=0.95?"B":"C");});
    let abcSummary=["A","B","C"].map(t=>({ABC分类:t,SKU数:skuSales.filter(r=>r.ABC分类===t).length,销售额:Math.round(sum(skuSales.filter(r=>r.ABC分类===t).map(r=>r.销售额))),占比:fmtPct(sum(skuSales.filter(r=>r.ABC分类===t).map(r=>r.销售额))/total)}));
    document.getElementById("inv-abc").innerHTML=`
      <div class="section-header">ABC 分类（按销售额占比）</div>
      <div class="table-wrap">${tableHtml(abcSummary,[{key:"ABC分类"},{key:"SKU数"},{key:"销售额"},{key:"占比"}])}</div>
      <div class="chart-box"><div id="abcChart" class="plot-chart"></div></div>
      ${insightHtml("ABC分类分析",[["info",`A类SKU ${abcSummary[0].SKU数} 个，贡献80%销售额，应重点监控。`]])}`;
    plot("abcChart",[
      {x:skuSales.map(r=>r.SKU),y:skuSales.map(r=>r.销售额),name:"销售额",type:"bar",marker:{color:skuSales.map(r=>r.ABC分类==="A"?COLORS[3]:(r.ABC分类==="B"?COLORS[4]:COLORS[7]))}},
      {x:skuSales.map(r=>r.SKU),y:skuSales.map(r=>r.累计占比),name:"累计占比",type:"scatter",yaxis:"y2",line:{color:COLORS[0],width:2.5}}
    ],{yaxis:{title:"销售额(元)"},yaxis2:{title:"累计占比",overlaying:"y",side:"right",tickformat:".0%"},height:420});
  } else document.getElementById("inv-abc").innerHTML="<div class='loading'>暂无数据</div>";

  // 资金占用
  if(inv.length){
    let rate=0.06;
    let rows=inv.map(r=>({...r,资金成本:round(r.库存金额*rate,2)})).sort((a,b)=>b.库存金额-a.库存金额);
    let totalCap=sum(inv.map(r=>r.库存金额)), totalCost=sum(rows.map(r=>r.资金成本));
    document.getElementById("inv-capital").innerHTML=`
      <div class="section-header">库存资金占用 & 资金成本（年化6%）</div>
      <div class="kpi-grid cols-3">
        <div class="kpi-card"><div class="kpi-label">库存总金额</div><div class="kpi-value">${fmtMoney(totalCap)}</div><div class="kpi-delta">${inv.length}个SKU</div></div>
        <div class="kpi-card danger"><div class="kpi-label">年资金成本</div><div class="kpi-value">${fmtMoney(totalCost)}</div><div class="kpi-delta">年化${fmtPct(rate)}</div></div>
        <div class="kpi-card accent"><div class="kpi-label">月资金成本</div><div class="kpi-value">${fmtMoney(totalCost/12)}</div><div class="kpi-delta">月均占用</div></div>
      </div>
      <div class="table-wrap">${tableHtml(rows.slice(0,30).map(r=>({SKU:r.SKU,期末库存:r.期末库存,库存金额:r.库存金额,库龄天数:r.库龄天数,资金成本:r.资金成本})),[{key:"SKU"},{key:"期末库存"},{key:"库存金额"},{key:"库龄天数"},{key:"资金成本"}])}</div>
      <div class="chart-box"><div id="capitalChart" class="plot-chart"></div></div>
      ${insightHtml("库存资金占用分析",[["warn",`库存资金占用 ${fmtMoney(totalCap)}，年资金成本 ${fmtMoney(totalCost)}，是隐性成本。`]])}`;
    let top=rows.slice(0,20);
    plot("capitalChart",[
      {x:top.map(r=>r.SKU),y:top.map(r=>r.库存金额),name:"库存金额",type:"bar",marker:{color:COLORS[0]}},
      {x:top.map(r=>r.SKU),y:top.map(r=>r.库龄天数),name:"库龄天数",type:"scatter",yaxis:"y2",line:{color:COLORS[1],width:2}}
    ],{yaxis:{title:"库存金额(元)"},yaxis2:{title:"库龄天数",overlaying:"y",side:"right"},height:400});
  } else document.getElementById("inv-capital").innerHTML="<div class='loading'>暂无库存数据</div>";

  // 周转趋势
  if(m.length&&inv.length){
    let totalStock=sum(inv.map(r=>r.库存金额));
    let rows=m.map(r=>({年月:r.年月,成品周转:round(totalStock/r.销售成本*30,1),原材料周转:round(totalStock/r.销售成本*30*0.4,1),在制品周转:round(totalStock/r.销售成本*30*0.2,1)}));
    document.getElementById("inv-turnover").innerHTML=`
      <div class="section-header">周转天数趋势（原材料/在制品/成品）</div>
      <div class="chart-box"><div id="turnoverChart" class="plot-chart"></div></div>
      ${insightHtml("周转趋势分析",[["info",`成品平均周转 ${round(mean(rows.map(r=>r.成品周转)),0)} 天。`]])}`;
    plot("turnoverChart",[
      {x:rows.map(r=>r.年月),y:rows.map(r=>r.原材料周转),name:"原材料周转",type:"scatter",mode:"lines+markers",line:{color:COLORS[0]}},
      {x:rows.map(r=>r.年月),y:rows.map(r=>r.在制品周转),name:"在制品周转",type:"scatter",mode:"lines+markers",line:{color:COLORS[1]}},
      {x:rows.map(r=>r.年月),y:rows.map(r=>r.成品周转),name:"成品周转",type:"scatter",mode:"lines+markers",line:{color:COLORS[2]}}
    ],{yaxis:{title:"周转天数"},height:400,shapes:[{type:"line",y0:BENCH.invTurnoverDays,y1:BENCH.invTurnoverDays,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[3]}}]});
  } else document.getElementById("inv-turnover").innerHTML="<div class='loading'>暂无数据</div>";

  // 安全库存
  if(inv.length&&c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let days=(c.orders[c.orders.length-1].日期-c.orders[0].日期)/(1000*60*60*24)+1;
    let skuDaily={}; valid.forEach(o=>{skuDaily[o.SKU]=(skuDaily[o.SKU]||0)+o.数量;});
    let invMap={}; inv.forEach(r=>invMap[r.SKU]=r.期末库存);
    let rows=Object.keys(skuDaily).map(sku=>{let daily=skuDaily[sku]/Math.max(1,days);let safe=Math.round(daily*14*1.5);let cur=invMap[sku]||0;
      return {SKU:sku,日均销量:round(daily,1),建议安全库存:safe,当前库存:cur,库存状态:cur<safe*0.5?"缺货风险":(cur<safe?"偏低":"充足")};}).sort((a,b)=>b.日均销量-a.日均销量);
    document.getElementById("inv-safety").innerHTML=`
      <div class="section-header">安全库存建议（基于销售预测）</div>
      <div class="table-wrap">${tableHtml(rows,[{key:"SKU"},{key:"日均销量"},{key:"建议安全库存"},{key:"当前库存"},{key:"库存状态"}])}</div>
      ${insightHtml("安全库存建议",[["warn",`缺货风险SKU ${rows.filter(r=>r.库存状态==="缺货风险").length} 个，需立即补货。`],["info","安全库存=日均销量×14天提前期×1.5安全系数。"]])}`;
  } else document.getElementById("inv-safety").innerHTML="<div class='loading'>暂无数据</div>";
}

/* ============================================================
   模块10：单品/SKU盈利矩阵
============================================================ */
function renderSKU(){
  let c=FILTERED;
  let html='<div class="module-header">🎯 模块10：单品/SKU盈利矩阵</div>';
  html+=`<div class="tabs"><button class="tab active" onclick="switchTab(this,'sku-bcg')">波士顿矩阵</button>
    <button class="tab" onclick="switchTab(this,'sku-pareto')">帕累托贡献</button>
    <button class="tab" onclick="switchTab(this,'sku-profit')">单品完全利润</button>
    <button class="tab" onclick="switchTab(this,'sku-cleanup')">尾部清理</button></div>`;
  html+='<div id="sku-bcg" class="tab-content active"></div><div id="sku-pareto" class="tab-content"></div><div id="sku-profit" class="tab-content"></div><div id="sku-cleanup" class="tab-content"></div>';
  document.getElementById("moduleContent").innerHTML=html;

  if(c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let ymPlat={};
    valid.forEach(o=>{let k=o.SKU+"|"+o.年月;(ymPlat[k]=ymPlat[k]||[]).push(o);});
    let skuYM={};
    Object.keys(ymPlat).forEach(k=>{let[sku,ym]=k.split("|");(skuYM[sku]=skuYM[sku]||[]).push({ym,qty:sum(ymPlat[k].map(o=>o.数量))});});
    let skuGroups=groupBy(valid,o=>o.SKU);
    let skuStats=Object.keys(skuGroups).map(sku=>{let rows=skuGroups[sku];let sales=sum(rows.map(r=>r.实付金额)),qty=sum(rows.map(r=>r.数量));
      let unitPrice=qty?sales/qty:0;let unitCost=c.production.length?(mean(c.production.filter(p=>p.SKU===sku).map(p=>p.单件生产成本))||unitPrice*0.45):unitPrice*0.45;
      let growth=0;let ymArr=(skuYM[sku]||[]).sort((a,b)=>a.ym.localeCompare(b.ym));
      if(ymArr.length>=2&&ymArr[0].qty>0){growth=(ymArr[ymArr.length-1].qty-ymArr[0].qty)/ymArr[0].qty;}
      return {SKU:sku,销量增长率:growth,毛利率:unitPrice?(unitPrice-unitCost)/unitPrice:0,销售额:sales,销量:qty};}).filter(r=>r.销量>0);
    let medG=median(skuStats.map(r=>r.销量增长率)), medM=median(skuStats.map(r=>r.毛利率));
    let maxSales=Math.max(...skuStats.map(r=>r.销售额));
    document.getElementById("sku-bcg").innerHTML=`
      <div class="section-header">波士顿矩阵：销量增长率 vs 毛利率</div>
      <div class="chart-box"><div id="bcgChart" class="plot-chart"></div></div>
      ${insightHtml("波士顿矩阵分析",[["info",`明星产品 ${skuStats.filter(r=>r.销量增长率>=medG&&r.毛利率>=medM).length} 个，应加大投入。`]])}`;
    plot("bcgChart",[{x:skuStats.map(r=>r.销量增长率),y:skuStats.map(r=>r.毛利率),text:skuStats.map(r=>r.SKU),mode:"markers",type:"scatter",
      marker:{size:skuStats.map(r=>r.销售额/maxSales*40+8),color:COLORS[1],line:{color:COLORS[0],width:1}},
      hovertemplate:"<b>%{text}</b><br>增长率: %{x:.1%}<br>毛利率: %{y:.1%}<extra></extra>"}],
      {xaxis:{title:"销量增长率",tickformat:".0%"},yaxis:{title:"毛利率",tickformat:".0%"},
       shapes:[{type:"line",y0:medM,y1:medM,x0:0,x1:1,xref:"paper",line:{dash:"dash",color:COLORS[7]}},{type:"line",x0:medG,x1:medG,y0:0,y1:1,yref:"paper",line:{dash:"dash",color:COLORS[7]}}],
       annotations:[{x:medG*1.5,y:medM*1.3,text:"⭐ 明星",showarrow:false,font:{color:COLORS[2],size:14}},{x:medG*0.5,y:medM*1.3,text:"❓ 问题",showarrow:false,font:{color:COLORS[4],size:14}},{x:medG*1.5,y:medM*0.5,text:"🐄 现金牛",showarrow:false,font:{color:COLORS[0],size:14}},{x:medG*0.5,y:medM*0.5,text:"🐕 瘦狗",showarrow:false,font:{color:COLORS[7],size:14}}],height:480});
  } else document.getElementById("sku-bcg").innerHTML="<div class='loading'>暂无订单数据</div>";

  // 帕累托
  if(c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let skuSales=Object.entries(groupBy(valid,o=>o.SKU)).map(([sku,rows])=>({SKU:sku,销售额:sum(rows.map(o=>o.实付金额))})).sort((a,b)=>b.销售额-a.销售额);
    let total=sum(skuSales.map(r=>r.销售额)), cum=0;
    skuSales.forEach(r=>{cum+=r.销售额;r.累计占比=cum/total;});
    let top20pct=Math.floor(skuSales.length*0.2), top20Contrib=skuSales.slice(0,top20pct).reduce((a,b)=>a+b.销售额,0)/total;
    document.getElementById("sku-pareto").innerHTML=`
      <div class="section-header">SKU 贡献度帕累托图（80/20法则）</div>
      <div class="chart-box"><div id="paretoChart" class="plot-chart"></div></div>
      ${insightHtml("帕累托贡献分析",[["info",`前20%的SKU（${top20pct}个）贡献了 ${fmtPct(top20Contrib)} 的销售额。`]])}`;
    plot("paretoChart",[
      {x:skuSales.map(r=>r.SKU),y:skuSales.map(r=>r.销售额),name:"销售额",type:"bar",marker:{color:COLORS[0]}},
      {x:skuSales.map(r=>r.SKU),y:skuSales.map(r=>r.累计占比),name:"累计占比",type:"scatter",yaxis:"y2",line:{color:COLORS[1],width:2.5}}
    ],{yaxis:{title:"销售额(元)"},yaxis2:{title:"累计占比",overlaying:"y",side:"right",tickformat:".0%"},height:420});
  } else document.getElementById("sku-pareto").innerHTML="<div class='loading'>暂无订单数据</div>";

  // 单品完全利润
  if(c.orders.length&&c.production.length){
    let valid=c.orders.filter(o=>!o.是否退货), ret=c.orders.filter(o=>o.是否退货);
    let skuCost={}; c.production.forEach(p=>{skuCost[p.SKU]=(skuCost[p.SKU]||0)+p.生产总成本;});
    let skuQty={}; c.production.forEach(p=>{skuQty[p.SKU]=(skuQty[p.SKU]||0)+p.生产数量;});
    let skuGroups=groupBy(valid,o=>o.SKU);
    let retGroups=groupBy(ret,o=>o.SKU);
    let rows=Object.keys(skuGroups).map(sku=>{let rows=skuGroups[sku];let rev=sum(rows.map(o=>o.实付金额)),qty=sum(rows.map(o=>o.数量));
      let cost=qty*(skuCost[sku]||rev*0.45)/Math.max(1,skuQty[sku]||1);
      let promo=sum(rows.map(o=>o.推广费分摊)), freight=sum(rows.map(o=>o.运费))*1.3;
      let retLoss=retGroups[sku]?sum(retGroups[sku].map(o=>o.实付金额)):0;
      let np=rev-cost-promo-freight-retLoss;
      return {SKU:sku,收入:Math.round(rev),销售件数:qty,生产成本:Math.round(cost),推广分摊:Math.round(promo),物流分摊:Math.round(freight),退货损失:Math.round(retLoss),单品净利润:Math.round(np),净利率:rev?fmtPct(np/rev):"-"};}).sort((a,b)=>b.单品净利润-a.单品净利润);
    document.getElementById("sku-profit").innerHTML=`
      <div class="section-header">单品完全利润（收入-生产-推广-物流-退货）</div>
      <div class="table-wrap">${tableHtml(rows,[{key:"SKU"},{key:"收入"},{key:"销售件数"},{key:"生产成本"},{key:"推广分摊"},{key:"物流分摊"},{key:"退货损失"},{key:"单品净利润"},{key:"净利率"}])}</div>
      <div class="chart-box"><div id="skuProfitChart" class="plot-chart"></div></div>
      ${insightHtml("单品完全利润分析",[["good",`利润最高SKU ${rows[0].SKU}（${fmtMoney(rows[0].单品净利润)}）。`],rows.filter(r=>r.单品净利润<0).length?["bad",`亏损SKU ${rows.filter(r=>r.单品净利润<0).length} 个，建议调整或淘汰。`]:["good","无亏损SKU。"]])}`;
    let top=rows.slice(0,15);
    plot("skuProfitChart",[{x:top.map(r=>r.SKU),y:top.map(r=>r.单品净利润),type:"bar",
      marker:{color:top.map(r=>r.单品净利润>0?COLORS[2]:COLORS[3])}}],{yaxis:{title:"净利润(元)"},height:400,showlegend:false});
  } else document.getElementById("sku-profit").innerHTML="<div class='loading'>暂无订单或生产数据</div>";

  // 尾部清理
  if(c.orders.length){
    let valid=c.orders.filter(o=>!o.是否退货);
    let ymKeys=[...new Set(valid.map(o=>o.年月))].sort();
    let recent3=ymKeys.slice(-3);
    let recentSKUs=new Set(valid.filter(o=>recent3.includes(o.年月)).map(o=>o.SKU));
    let allSKUs=new Set(valid.map(o=>o.SKU));
    let zeroSales=[...allSKUs].filter(s=>!recentSKUs.has(s));
    let skuCost={},skuQty={}; c.production.forEach(p=>{skuCost[p.SKU]=(skuCost[p.SKU]||0)+p.生产总成本;skuQty[p.SKU]=(skuQty[p.SKU]||0)+p.生产数量;});
    let lowMargin=[];
    if(c.production.length){
      let skuPrice={}; valid.forEach(o=>{skuPrice[o.SKU]=(skuPrice[o.SKU]||0)+o.实付金额;});
      let skuQ={}; valid.forEach(o=>{skuQ[o.SKU]=(skuQ[o.SKU]||0)+o.数量;});
      allSKUs.forEach(sku=>{let price=skuPrice[sku]/Math.max(1,skuQ[sku]);let cost=(skuCost[sku]||0)/Math.max(1,skuQty[sku]||1);if(price&&cost&&(price-cost)/price<0.10) lowMargin.push(sku);});
    }
    let cleanList=[];
    zeroSales.forEach(s=>cleanList.push({SKU:s,问题类型:"连续3月零销量",建议:"立即清仓下架"}));
    lowMargin.forEach(s=>{if(!zeroSales.includes(s)) cleanList.push({SKU:s,问题类型:"毛利率<10%",建议:"提价或降本，否则淘汰"});});
    document.getElementById("sku-cleanup").innerHTML=`
      <div class="section-header">尾部清理建议（连续3月零销量或毛利率<10%）</div>
      ${cleanList.length?`<div class="table-wrap">${tableHtml(cleanList,[{key:"SKU"},{key:"问题类型"},{key:"建议"}])}</div>${cleanList.map(r=>alertHtml("warning","🔄 "+r.SKU+"："+r.问题类型+" — "+r.建议)).join("")}`:"<div class='alert-box alert-success'>未发现需要清理的尾部SKU。</div>"}
      ${insightHtml("尾部清理建议",[["warn",`零销量SKU ${zeroSales.length} 个，低毛利SKU ${lowMargin.length} 个，建议清理。`]])}`;
  } else document.getElementById("sku-cleanup").innerHTML="<div class='loading'>暂无订单数据</div>";
}

/* ============================================================
   数据概览
============================================================ */
function renderOverview(){
  let html='<div class="module-header">📋 数据概览</div>';
  let tables=[["orders","订单表"],["production","生产表"],["inventory","库存表"],["expense","费用表"],["personnel","人员表"],["tax","税负表"],["logistics","物流表"]];
  let rows=tables.map(([k,n])=>{let df=DATA[k];return df?{数据表:n,记录数:df.length.toLocaleString(),字段数:Object.keys(df[0]||{}).length,字段:Object.keys(df[0]||{}).slice(0,8).join("、")}:{数据表:n,记录数:0,字段数:0,字段:"无数据"};});
  html+=`<div class="table-wrap">${tableHtml(rows,[{key:"数据表"},{key:"记录数"},{key:"字段数"},{key:"字段"}])}</div>`;
  if(MONTHLY&&MONTHLY.length){
    html+='<div class="section-header">月度财务汇总预览</div>';
    let preview=MONTHLY.slice(-12).map(r=>({年月:r.年月,GMV:fmtMoney(r.GMV),净销售额:fmtMoney(r.净销售额),毛利率:fmtPct(r.毛利率),净利润:fmtMoney(r.净利润),净利率:fmtPct(r.净利率),退货率:fmtPct(r.退货率),推广费率:fmtPct(r.推广费率)}));
    html+=`<div class="table-wrap">${tableHtml(preview,[{key:"年月"},{key:"GMV"},{key:"净销售额"},{key:"毛利率"},{key:"净利润"},{key:"净利率"},{key:"退货率"},{key:"推广费率"}])}</div>`;
  }
  document.getElementById("moduleContent").innerHTML=html;
}

/* ============================================================
   主控函数：导航、标签切换、筛选、初始化
============================================================ */
const MODULES=[
  {key:"overview",name:"数据概览",render:renderOverview},
  {key:"ceo",name:"1. CEO驾驶舱",render:renderCEO},
  {key:"profit",name:"2. 盈利深度分析",render:renderProfit},
  {key:"cost",name:"3. 成本全链路拆解",render:renderCost},
  {key:"tax",name:"4. 税负智能分析",render:renderTax},
  {key:"pricing",name:"5. 定价与单价分析",render:renderPricing},
  {key:"logistics",name:"6. 运费与物流分析",render:renderLogistics},
  {key:"promotion",name:"7. 推广投放效率",render:renderPromotion},
  {key:"personnel",name:"8. 人效与组织效率",render:renderPersonnel},
  {key:"inventory",name:"9. 库存与资金",render:renderInventory},
  {key:"sku",name:"10. SKU盈利矩阵",render:renderSKU}
];

function buildNav(){
  let html="";
  MODULES.forEach(m=>{html+=`<div class="nav-item ${m.key===currentModule?'active':''}" onclick="selectModule('${m.key}')">${m.name}</div>`;});
  document.getElementById("navList").innerHTML=html;
}
function buildPlatformFilter(){
  let html='<label><input type="checkbox" value="全部" checked onchange="onPlatformChange()"> 全部</label>';
  PLATFORMS.forEach(p=>{html+=`<label><input type="checkbox" value="${p}" onchange="onPlatformChange()"> ${p}</label>`;});
  document.getElementById("platformFilter").innerHTML=html;
}
function onPlatformChange(){
  let checked=Array.from(document.querySelectorAll('#platformFilter input:checked')).map(c=>c.value);
  if(checked.includes("全部")||checked.length===0){ platformFilter=["全部"]; }
  else { platformFilter=checked; }
  if(DATA){ FILTERED=filterData(); renderModule(); }
}
function selectModule(key){
  currentModule=key;
  buildNav();
  renderModule();
}
function switchTab(btn,contentId){
  let tabs=btn.parentNode.querySelectorAll('.tab');
  tabs.forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  let contents=btn.parentNode.parentNode.querySelectorAll('.tab-content');
  contents.forEach(c=>c.classList.remove('active'));
  document.getElementById(contentId).classList.add('active');
}
function applyFilters(){
  dateFilter=[document.getElementById("startDate").value,document.getElementById("endDate").value];
  if(DATA){ FILTERED=filterData(); renderModule(); }
  updateSubTitle();
}
function updateSubTitle(){
  let pf=platformFilter.includes("全部")?"全部":platformFilter.join("、");
  document.getElementById("subTitle").innerHTML=`覆盖"生产-仓储-销售-回款"全链路财务监控 | 数据周期：${dateFilter[0]} 至 ${dateFilter[1]} | 平台：${pf}`;
}
function renderModule(){
  let m=MODULES.find(x=>x.key===currentModule);
  if(m){ document.getElementById("moduleContent").innerHTML="<div class='loading'>渲染中...</div>"; setTimeout(()=>{try{m.render();}catch(e){document.getElementById("moduleContent").innerHTML=`<div class='alert-box alert-danger'>模块渲染异常：${e.message}</div>`;}},50); }
}

/* 加载模拟数据 */
function loadMockData(){
  document.getElementById("moduleContent").innerHTML="<div class='loading'>正在生成24个月模拟数据，请稍候...</div>";
  setTimeout(()=>{
    DATA=preprocessData(generateMockData());
    MONTHLY=getMonthlySummary(DATA);
    FILTERED=filterData();
    document.getElementById("dataSourceBanner").innerHTML=`<div class="data-source-banner banner-info">ℹ️ 当前使用模拟数据（24个月），上传 Excel 文件可替换为真实数据。</div>`;
    updateSubTitle();
    renderModule();
  },100);
}

/* Excel 上传解析 */
function handleFileUpload(file){
  let reader=new FileReader();
  reader.onload=function(e){
    try{
      let data=new Uint8Array(e.target.result);
      let wb=XLSX.read(data,{type:"array"});
      let sheetMap={"订单":"orders","生产":"production","库存":"inventory","费用":"expense","人员":"personnel","税负":"tax","物流":"logistics"};
      let parsed={};
      wb.SheetNames.forEach(sn=>{
        let key=null;
        for(let kw in sheetMap){ if(sn.includes(kw)){ key=sheetMap[kw]; break; } }
        if(key){ let ws=wb.Sheets[sn]; parsed[key]=XLSX.utils.sheet_to_json(ws); }
      });
      if(Object.keys(parsed).length===0){ alert("未识别到有效数据sheet，请确保Excel含订单/生产/库存/费用/人员/税负/物流表。"); return; }
      // 补全缺失表
      ["orders","production","inventory","expense","personnel","tax","logistics"].forEach(k=>{ if(!parsed[k]) parsed[k]=[]; });
      DATA=preprocessData(parsed);
      MONTHLY=getMonthlySummary(DATA);
      FILTERED=filterData();
      document.getElementById("dataSourceBanner").innerHTML=`<div class="data-source-banner banner-success">✅ 已加载上传文件：${file.name}（${Object.values(parsed).reduce((a,b)=>a+b.length,0)} 条记录）</div>`;
      updateSubTitle();
      renderModule();
    }catch(err){ alert("文件解析失败："+err.message); }
  };
  reader.readAsArrayBuffer(file);
}

/* 初始化 */
window.onload=function(){
  buildNav();
  buildPlatformFilter();
  document.getElementById("fileInput").addEventListener("change",function(e){ if(e.target.files[0]) handleFileUpload(e.target.files[0]); });
  loadMockData();
};
</script>
